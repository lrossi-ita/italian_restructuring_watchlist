function trendsFor(d, trends) {
  if (d.trends && d.trends.length) return trends.filter((t) => d.trends.includes(t.id));
  const s = (d.sector || "").toLowerCase();
  return trends.filter((t) => {
    if ((t.keywords || []).some((k) => s.includes(k))) return true;
    if (t.leverageThreshold) {
      const f = d.financials || {};
      const db = Number(f.debt);
      const e = Number(f.ebitda);
      if (f.debt != null && f.ebitda != null && e > 0 && db / e > t.leverageThreshold) return true;
    }
    return false;
  });
}

const LATEST_PACK = [...UPDATE_PACKS].reverse().find((p) => (p.patches || []).length || (p.newDossiers || []).length) || UPDATE_PACKS[0];
const NEW_PACK_IDS = UPDATE_PACKS.filter((p) => p.date === LATEST_PACK.date).map((p) => p.id);

function applyPack(dossiers, macro, pack) {
  const ds = JSON.parse(JSON.stringify(dossiers));
  const m = JSON.parse(JSON.stringify(macro));
  const stamp = pack.date + "T09:00:00.000Z";
  const mark = (n) => ({ ...n, id: uid(), pack: pack.id });
  let nNews = 0;
  let nCred = 0;
  let nArt = 0;
  const added = [];
  (pack.removeDossiers || []).forEach((rid) => {
    const k = ds.findIndex((d) => d.id === rid);
    if (k >= 0) ds.splice(k, 1);
  });
  (pack.newDossiers || []).forEach((nd) => {
    if (ds.some((d) => d.id === nd.id || d.name.toLowerCase() === nd.name.toLowerCase())) return;
    ds.push({ ...nd, creditors: (nd.creditors || []).map((c) => ({ ...c, pack: pack.id })), news: nd.news.map(mark), updatedAt: stamp });
    added.push(nd.name);
    nCred += (nd.creditors || []).length;
    nNews += nd.news.length;
  });
  (pack.patches || []).forEach((p) => {
    const d = ds.find((x) => x.id === p.id);
    if (!d) return;
    if (p.fields) Object.assign(d, p.fields);
    d.creditors = d.creditors || [];
    (p.creditorUpdates || []).forEach((u) => {
      const c = d.creditors.find((x) => credKey(x.name) === credKey(u.name));
      if (c) Object.assign(c, u, { pack: pack.id });
    });
    (p.creditors || []).forEach((c) => {
      if (!d.creditors.some((x) => credKey(x.name) === credKey(c.name))) {
        d.creditors.push({ ...c, pack: pack.id });
        nCred++;
      }
    });
    (p.advisors || []).forEach((a) => {
      if (!d.advisors.some((x) => x.name.toLowerCase() === a.name.toLowerCase())) d.advisors.push(a);
    });
    (p.news || []).forEach((n) => {
      if (!d.news.some((x) => x.title.toLowerCase() === n.title.toLowerCase())) {
        d.news.push(mark(n));
        nNews++;
      }
    });
    d.news.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    d.updatedAt = stamp;
  });
  (pack.indicators || []).forEach((u) => {
    const i = m.indicators.find((x) => x.id === u.id);
    if (i) Object.assign(i, u);
  });
  if ((pack.indicators || []).length) m.updatedAt = stamp;
  (pack.articles || []).forEach(({ trend, article }) => {
    const t = m.trends.find((x) => x.id === trend);
    if (!t) return;
    t.articles = t.articles || [];
    if (!t.articles.some((x) => (article.url && x.url === article.url) || x.title === article.title)) {
      t.articles.push({ ...article, id: uid(), pack: pack.id });
      nArt++;
    }
  });
  (pack.signals || []).forEach((s) => {
    const t = m.trends.find((x) => x.id === s.trend);
    if (t && !(t.signals || []).some((x) => x.title === s.signal.title)) {
      t.signals = [{ ...s.signal, id: uid() }, ...(t.signals || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    }
  });
  return { ds, m, nNews, nCred, nArt, added };
}

function applyAllPacks(dossiers, macro, skip = []) {
  let ds = dossiers;
  let m = macro;
  const summary = [];
  UPDATE_PACKS.filter((p) => !skip.includes(p.id)).forEach((p) => {
    const r = applyPack(ds, m, p);
    ds = r.ds;
    m = r.m;
    summary.push({ pack: p, nNews: r.nNews, nCred: r.nCred, nArt: r.nArt, added: r.added });
  });
  return { ds, m, summary };
}

/* ---------- helpers ---------- */

function fmtNum(v) {
  if (v === null || v === undefined || v === "") return "n.d.";
  const n = Number(v);
  if (!isFinite(n)) return "n.d.";
  return n.toLocaleString("it-IT", { maximumFractionDigits: 1 });
}

function leverage(f) {
  if (!f || f.debt == null || f.ebitda == null) return null;
  const d = Number(f.debt);
  const e = Number(f.ebitda);
  if (!isFinite(d) || !isFinite(e) || e <= 0) return null;
  return (d / e).toLocaleString("it-IT", { maximumFractionDigits: 1 }) + "x";
}

function fmtDate(s) {
  if (!s) return "n.d.";
  const d = new Date(s.length === 10 ? s + "T00:00:00" : s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString("it-IT", { day: "2-digit", month: "short", year: "numeric" });
}

function daysUntil(s) {
  if (!s) return null;
  const d = new Date(s + "T00:00:00");
  if (isNaN(d)) return null;
  const t = new Date(todayISO() + "T00:00:00");
  return Math.round((d - t) / 86400000);
}

function normInstrument(v) {
  if (!v) return null;
  if (INSTRUMENTS.includes(v)) return v;
  const low = v.toLowerCase();
  if (low.includes("composizione")) return "Composizione negoziata";
  if (low.includes("accord")) return "Accordo di ristrutturazione";
  if (low.includes("concordato")) return "Concordato preventivo";
  if (low.includes("straordinaria")) return "Amministrazione straordinaria";
  if (low.includes("liquidazione")) return "Liquidazione giudiziale";
  if (low.includes("attestat")) return "Piano attestato";
  if (low.includes("omologazione") || low.includes("pro")) return "PRO";
  if (low.includes("extend") || low.includes("waiver") || low.includes("stragiudizial")) return "Stragiudiziale / A&E";
  return "Altro";
}

function parseJSON(text) {
  const clean = text.replace(/```json|```/g, "").trim();
  const s = clean.indexOf("{");
  const e = clean.lastIndexOf("}");
  if (s < 0 || e < 0) throw new Error("La risposta non contiene dati strutturati. Riprova.");
  return JSON.parse(clean.slice(s, e + 1));
}

function getApiKey() {
  let k = "";
  try { k = localStorage.getItem("rx-anthropic-key") || ""; } catch (e) {}
  if (!k) {
    k = (window.prompt("Inserisci la tua Anthropic API key (resta solo nel tuo browser):") || "").trim();
    if (k) { try { localStorage.setItem("rx-anthropic-key", k); } catch (e) {} }
  }
  if (!k) throw new Error("API key mancante: aggiornamenti AI non disponibili.");
  return k;
}
window.resetApiKey = () => { try { localStorage.removeItem("rx-anthropic-key"); } catch (e) {} };

async function callClaude(prompt, useSearch) {
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: prompt }],
  };
  if (useSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": getApiKey(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("Richiesta non riuscita (codice " + res.status + ").");
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return parseJSON(text);
}

Rispondi SOLO con JSON valido, senza testo prima o dopo e senza backtick: {"dossiers":[{"name":"","sector":"", ...campi}]} dove ogni dossier ha anche questi campi:
${SCHEMA}
Regole: importi in milioni di euro; usa solo informazioni presenti nel testo, null se assenti; riassunti brevi con parole tue; se nel testo non c'è una data usa ${todayISO()}.

TESTO:
"""${text.slice(0, 12000)}"""`;
}

function buildProposal(d, r, forceTag) {
  const items = [];
  (r.news || []).forEach((n) => {
    if (!n || !n.title) return;
    const dup = d.news.some(
      (x) => (n.url && x.url === n.url) || x.title.trim().toLowerCase() === n.title.trim().toLowerCase()
    );
    if (!dup)
      items.push({
        id: uid(),
        kind: "news",
        on: true,
        value: {
          id: uid(),
          date: n.date || todayISO(),
          title: n.title,
          summary: n.summary || "",
          source: n.source || "",
          url: n.url || "",
          tag: forceTag || (n.tag === "F" ? "F" : "S"),
        },
      });
  });
  const f = r.financials;
  if (f) {
    ["revenue", "ebitda", "debt"].forEach((k) => {
      if (f[k] != null && isFinite(Number(f[k])) && Number(f[k]) !== Number(d.financials?.[k])) {
        items.push({
          id: uid(),
          kind: "fin",
          key: k,
          on: d.financials?.[k] == null,
          value: Number(f[k]),
          old: d.financials?.[k],
          meta: { year: f.year, source: f.source },
        });
      }
    });
  }
  ["instrument", "court", "phase"].forEach((k) => {
    let v = r[k];
    if (k === "instrument") v = normInstrument(v);
    if (v && v !== d[k]) items.push({ id: uid(), kind: "field", key: k, on: !d[k] || d[k] === "Altro", value: v, old: d[k] });
  });
  if (r.sector && !d.sector) items.push({ id: uid(), kind: "field", key: "sector", on: true, value: r.sector, old: "" });
  (r.advisors || []).forEach((a) => {
    if (a && a.name && !d.advisors.some((x) => x.name.toLowerCase() === a.name.toLowerCase()))
      items.push({
        id: uid(),
        kind: "adv",
        on: true,
        value: { name: a.name, role: a.role || "", side: SIDES.includes(a.side) ? a.side : "Debitore" },
      });
  });
  (r.creditors || []).forEach((c) => {
    if (c && c.name && !(d.creditors || []).some((x) => credKey(x.name) === credKey(c.name)))
      items.push({
        id: uid(),
        kind: "cred",
        on: true,
        value: {
          name: c.name,
          type: CRED_TYPES.includes(c.type) ? c.type : "Altro",
          exposure: c.exposure != null && isFinite(Number(c.exposure)) ? Number(c.exposure) : null,
          note: c.note || "",
          source: forceTag === "DW" ? "Debtwire" : "Ricerca web",
          url: "",
          tag: forceTag || "S",
        },
      });
  });
  const m = r.nextMilestone;
  if (m && m.date && m.date !== d.milestone?.date)
    items.push({ id: uid(), kind: "milestone", on: true, value: { date: m.date, label: m.label || "" }, old: d.milestone });
  return items;
}

function applyProposal(d, items) {
  const nd = JSON.parse(JSON.stringify(d));
  nd.financials = nd.financials || {};
  items
    .filter((i) => i.on)
    .forEach((i) => {
      if (i.kind === "news") nd.news.push(i.value);
      if (i.kind === "fin") {
        nd.financials[i.key] = i.value;
        if (i.meta?.year) nd.financials.year = i.meta.year;
        if (i.meta?.source) nd.financials.source = i.meta.source;
      }
      if (i.kind === "field") nd[i.key] = i.value;
      if (i.kind === "adv") nd.advisors.push(i.value);
      if (i.kind === "milestone") nd.milestone = i.value;
      if (i.kind === "cred") nd.creditors = [...(nd.creditors || []), i.value];
    });
  nd.news.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  nd.updatedAt = new Date().toISOString();
  return nd;
}

function macroPrompt(inds) {
  return `Sei un economista che supporta un team di restructuring in Italia. Data odierna: ${todayISO()}.
Usa la ricerca web per trovare il valore più recente disponibile di questi indicatori riferiti all'Italia:
${inds.map((i) => `- id "${i.id}": ${i.label} (ultimo valore registrato: ${i.value}, del ${i.date})`).join("\n")}
Rispondi SOLO con JSON valido, senza testo prima o dopo e senza backtick:
{"indicators":[{"id":"","value":"valore con unità","prior":"valore precedente con riferimento","date":"YYYY-MM-DD","note":"max 20 parole","source":"fonte","url":"https://...","tag":"F o S","risk":"su|stabile|giu"}]}
Regole: includi solo gli indicatori per cui trovi un dato più recente o diverso; "risk" indica l'effetto sul rischio di crisi delle imprese italiane (su = aumenta); tag F per fonti ufficiali (Istat, Banca d'Italia, BCE, ABI, S&P Global), S per stampa; non inventare.`;
}

function trendPrompt(t) {
  return `Sei un analista di restructuring in Italia. Data odierna: ${todayISO()}.
Usa la ricerca web per trovare notizie degli ultimi 30 giorni sul tema "${t.title}", con impatto sulle imprese italiane dei settori: ${t.sectors.join(", ")}.
Cerca fatti concreti: dati, casi aziendali, procedure, misure di governo, prezzi.
Rispondi SOLO con JSON valido, senza testo prima o dopo e senza backtick:
{"signals":[{"date":"YYYY-MM-DD","title":"","summary":"max 25 parole, parafrasi","source":"testata","url":"https://...","tag":"F o S"}]}
Massimo 4 segnali, i più recenti e rilevanti. Non inventare.`;
}

function buildIndicatorProposal(macro, r) {
  return (r.indicators || [])
    .filter((x) => x && x.id && x.value)
    .map((x) => {
      const cur = macro.indicators.find((i) => i.id === x.id);
      if (!cur || (cur.value === x.value && cur.date === x.date)) return null;
      return { id: uid(), kind: "ind", on: true, value: x, old: cur };
    })
    .filter(Boolean);
}

function buildSignalProposal(t, r) {
  const seen = t.signals || [];
  return (r.signals || [])
    .filter(
      (s) =>
        s && s.title &&
        !seen.some((x) => x.title.toLowerCase() === s.title.toLowerCase() || (s.url && x.url === s.url))
    )
    .map((s) => ({
      id: uid(),
      kind: "signal",
      on: true,
      value: {
        id: uid(),
        date: s.date || todayISO(),
        title: s.title,
        summary: s.summary || "",
        source: s.source || "",
        url: s.url || "",
        tag: s.tag === "F" ? "F" : "S",
      },
    }));
}

function Due({ date }) {
  const n = daysUntil(date);
  if (n === null) return null;
  if (n < 0) return <span className="rx-due past">scaduta da {Math.abs(n)} gg</span>;
  if (n === 0) return <span className="rx-due">oggi</span>;
  return <span className="rx-due">tra {n} gg</span>;
}

  const [d, setD] = useState(() => JSON.parse(JSON.stringify(initial)));
  const [adv, setAdv] = useState(() => initial.advisors.map((a) => [a.name, a.role, a.side].join(" | ")).join("\n"));
  const [cred, setCred] = useState(() =>
    (initial.creditors || []).map((c) => [c.name, c.type, c.exposure ?? "", c.note || ""].join(" | ")).join("\n")
  );
  const set = (k, v) => setD((p) => ({ ...p, [k]: v }));
  const setF = (k, v) => setD((p) => ({ ...p, financials: { ...p.financials, [k]: v } }));
  const numOrNull = (v) => (v === "" || v == null ? null : isFinite(Number(String(v).replace(",", "."))) ? Number(String(v).replace(",", ".")) : null);

  const save = () => {
    if (!d.name.trim()) return;
    const advisors = adv
      .split("\n")
      .map((l) => l.split("|").map((x) => x.trim()))
      .filter((p) => p[0])
      .map((p) => ({ name: p[0], role: p[1] || "", side: SIDES.includes(p[2]) ? p[2] : "Debitore" }));
    onSave({
      ...d,
      name: d.name.trim(),
      advisors,
      creditors: cred
        .split("\n")
        .map((l) => l.split("|").map((x) => x.trim()))
        .filter((p) => p[0])
        .map((p) => {
          const prev = (initial.creditors || []).find((c) => credKey(c.name) === credKey(p[0]));
          const ex = p[2] ? Number(String(p[2]).replace(",", ".")) : null;
          return {
            ...(prev || { source: "Inserimento manuale", url: "", tag: "I" }),
            name: p[0],
            type: CRED_TYPES.includes(p[1]) ? p[1] : "Altro",
            exposure: ex != null && isFinite(ex) ? ex : null,
            note: p[3] || "",
            generic: prev ? !!prev.generic : /non pubblic|non nominat/i.test(p[0]),
          };
        }),
      financials: {
        ...d.financials,
        revenue: numOrNull(d.financials.revenue),
        ebitda: numOrNull(d.financials.ebitda),
        debt: numOrNull(d.financials.debt),
      },
      milestone: d.milestone && d.milestone.date ? d.milestone : null,
      updatedAt: new Date().toISOString(),
    });
  };

  return (
    <div className="rx-ov" role="dialog" aria-modal="true" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="rx-modal">
        <h3>{initial.name ? "Modifica dossier" : "Nuovo dossier"}</h3>
        <p className="lead">Importi in milioni di euro. Lascia vuoto ciò che non è disponibile: verrà mostrato come n.d.</p>
        <div className="rx-form">
          <label className="full">Debitore<input className="rx-in" value={d.name} onChange={(e) => set("name", e.target.value)} autoFocus /></label>
          <label>Settore<input className="rx-in" value={d.sector} onChange={(e) => set("sector", e.target.value)} /></label>
          <label>Strumento
            <select className="rx-in" value={d.instrument} onChange={(e) => set("instrument", e.target.value)}>
              {INSTRUMENTS.map((i) => <option key={i}>{i}</option>)}
            </select>
          </label>
          <label>Tribunale / autorità<input className="rx-in" value={d.court} onChange={(e) => set("court", e.target.value)} /></label>
          <label>Fase<input className="rx-in" value={d.phase} onChange={(e) => set("phase", e.target.value)} /></label>
          <label>Ricavi<input className="rx-in rx-num" value={d.financials.revenue ?? ""} onChange={(e) => setF("revenue", e.target.value)} /></label>
          <label>EBITDA<input className="rx-in rx-num" value={d.financials.ebitda ?? ""} onChange={(e) => setF("ebitda", e.target.value)} /></label>
          <label>Debito (netto o lordo, specifica nella nota)<input className="rx-in rx-num" value={d.financials.debt ?? ""} onChange={(e) => setF("debt", e.target.value)} /></label>
          <label>Esercizio di riferimento<input className="rx-in" value={d.financials.year || ""} onChange={(e) => setF("year", e.target.value)} /></label>
          <label>Fonte dei financials<input className="rx-in" value={d.financials.source || ""} onChange={(e) => setF("source", e.target.value)} /></label>
          <label>Nota sui financials<input className="rx-in" value={d.financials.note || ""} onChange={(e) => setF("note", e.target.value)} /></label>
          <label>Prossima scadenza<input type="date" className="rx-in" value={d.milestone?.date || ""} onChange={(e) => set("milestone", { ...(d.milestone || {}), date: e.target.value })} /></label>
          <label>Descrizione della scadenza<input className="rx-in" value={d.milestone?.label || ""} onChange={(e) => set("milestone", { ...(d.milestone || {}), label: e.target.value })} /></label>
          <label className="full">Principali creditori, uno per riga: Nome | Tipo ({CRED_TYPES.join(", ")}) | Esposizione in mln € | Nota
            <textarea className="rx-in" value={cred} onChange={(e) => setCred(e.target.value)} />
          </label>
          <label className="full">Advisor e soggetti coinvolti, uno per riga: Nome | Ruolo | Lato ({SIDES.join(", ")})
            <textarea className="rx-in" value={adv} onChange={(e) => setAdv(e.target.value)} />
          </label>
          <fieldset className="full rx-fs">
            <legend>Angolo di ingresso per AlixPartners</legend>
            {ANGLES.map((a) => {
              const on = (d.angle || []).includes(a);
              return (
                <label key={a} className="rx-chk">
                  <input type="checkbox" checked={on} onChange={() => set("angle", on ? (d.angle || []).filter((x) => x !== a) : [...(d.angle || []), a])} />
                  {a}
                </label>
              );
            })}
          </fieldset>
          {allTrends.length > 0 && (
            <fieldset className="full rx-fs">
              <legend>Macrotrend rilevanti. Se non ne selezioni nessuno, l'abbinamento è automatico per settore e leva</legend>
              {allTrends.map((t) => {
                const on = (d.trends || []).includes(t.id);
                return (
                  <label key={t.id} className="rx-chk">
                    <input
                      type="checkbox"
                      checked={on}
                      onChange={() => set("trends", on ? (d.trends || []).filter((x) => x !== t.id) : [...(d.trends || []), t.id])}
                    />
                    {t.title}
                  </label>
                );
              })}
            </fieldset>
          )}
        </div>
        <div className="rx-mfoot">
          <button className="rx-btn" onClick={onClose}>Annulla</button>
          <button className="rx-btn pri" onClick={save} disabled={!d.name.trim()}>Salva dossier</button>
        </div>
      </div>
    </div>
  );
}

function ImportModal({ onRun, onClose, busy }) {
  const [text, setText] = useState("");
  return (
    <div className="rx-ov" role="dialog" aria-modal="true" onClick={(e) => e.target === e.currentTarget && !busy && onClose()}>
      <div className="rx-modal">
        <h3>Importa da Debtwire o da un articolo</h3>
        <p className="lead">Incolla il testo di un alert, di un digest o di un articolo. Estraggo debitori, financials, strumento, advisor e notizie, e ti mostro le modifiche prima di applicarle.</p>
        <textarea className="rx-in" style={{ width: "100%", minHeight: 220 }} value={text} onChange={(e) => setText(e.target.value)} placeholder="Incolla qui il testo…" />
        <div className="rx-mfoot">
          <button className="rx-btn" onClick={onClose} disabled={busy}>Annulla</button>
          <button className="rx-btn pri" onClick={() => onRun(text)} disabled={busy || text.trim().length < 40}>
            {busy ? "Estrazione in corso…" : "Estrai informazioni"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ReviewModal({ review, index, total, onToggle, onApply, onSkip }) {
  const renderItem = (i) => {
    if (i.kind === "news")
      return (
        <>
          <div className="k">Nuova notizia, {fmtDate(i.value.date)}, <span className={"rx-tag " + i.value.tag}>{i.value.tag}</span></div>
          <div style={{ fontWeight: 600 }}>{i.value.title}</div>
          <div>{i.value.summary}</div>
          <div className="k">{i.value.source}</div>
        </>
      );
    if (i.kind === "fin")
      return (
        <>
          <div className="k">{FIELD_LABEL[i.key]} (mln €){i.meta?.year ? ", " + i.meta.year : ""}{i.meta?.source ? ", fonte: " + i.meta.source : ""}</div>
          <div className="rx-num">{i.old != null && <span className="old">{fmtNum(i.old)}</span>}{fmtNum(i.value)}</div>
        </>
      );
    if (i.kind === "field")
      return (
        <>
          <div className="k">{FIELD_LABEL[i.key]}</div>
          <div>{i.old && <span className="old">{i.old}</span>}{i.value}</div>
        </>
      );
    if (i.kind === "adv")
      return (
        <>
          <div className="k">Nuovo advisor o soggetto, lato {i.value.side}</div>
          <div>{i.value.name}{i.value.role ? ", " + i.value.role : ""}</div>
        </>
      );
    if (i.kind === "milestone")
      return (
        <>
          <div className="k">Prossima scadenza</div>
          <div>{i.old?.date && <span className="old">{fmtDate(i.old.date)}</span>}{fmtDate(i.value.date)}, {i.value.label}</div>
        </>
      );
    if (i.kind === "ewsig")
      return (
        <>
          <div className="k">Nuovo segnale, {FAM_LABEL[i.value.family]}, severità {SEV_ADJ[i.value.severity]}, {fmtDate(i.value.date)}, <span className={"rx-tag " + i.value.tag}>{i.value.tag}</span></div>
          <div style={{ fontWeight: 600 }}>{i.value.title}</div>
          {i.value.value && <div>{i.value.value}</div>}
          <div className="k">{i.value.source}</div>
        </>
      );
    if (i.kind === "cred")
      return (
        <>
          <div className="k">Nuovo creditore, {i.value.type}{i.value.exposure != null ? `, esposizione ${fmtNum(i.value.exposure)} mln €` : ""}</div>
          <div style={{ fontWeight: 600 }}>{i.value.name}</div>
          {i.value.note && <div>{i.value.note}</div>}
        </>
      );
    if (i.kind === "ind")
      return (
        <>
          <div className="k">
            {i.old.label}{i.value.date ? ", " + fmtDate(i.value.date) : ""}{i.value.source ? ", fonte: " + i.value.source : ""}
          </div>
          <div className="rx-num"><span className="old">{i.old.value}</span>{i.value.value}</div>
          {i.value.note && <div className="k">{i.value.note}</div>}
        </>
      );
    if (i.kind === "signal")
      return (
        <>
          <div className="k">Nuovo articolo, {fmtDate(i.value.date)}, <span className={"rx-tag " + i.value.tag}>{i.value.tag}</span></div>
          <div style={{ fontWeight: 600 }}>{i.value.title}</div>
          <div>{i.value.summary}</div>
          <div className="k">{i.value.source}</div>
        </>
      );
    return null;
  };

  return (
    <div className="rx-ov" role="dialog" aria-modal="true">
      <div className="rx-modal">
        <h3>{review.title || (review.isNew ? "Nuovo dossier: " : "Aggiornamenti per ") + review.dossier.name}</h3>
        <p className="lead">
          {total > 1 ? `Altri ${total - 1} dossier in coda dopo questo. ` : ""}
          Seleziona cosa applicare. I valori che sovrascrivono dati esistenti sono deselezionati di default: verifica la fonte prima di confermarli.
        </p>
        {review.items.length === 0 ? (
          <p>Nessuna informazione nuova rispetto a quanto già registrato.</p>
        ) : (
          <ul className="rx-prop">
            {review.items.map((i) => (
              <li key={i.id}>
                <input type="checkbox" checked={i.on} onChange={() => onToggle(i.id)} aria-label="Applica questa modifica" />
                <div>{renderItem(i)}</div>
              </li>
            ))}
          </ul>
        )}
        <div className="rx-mfoot">
          <button className="rx-btn" onClick={onSkip}>{review.items.length ? "Scarta" : "Chiudi"}</button>
          {review.items.length > 0 && (
            <button className="rx-btn pri" onClick={onApply}>
              Applica {review.items.filter((i) => i.on).length} modifiche
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function AddNews({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [n, setN] = useState({ date: todayISO(), title: "", summary: "", source: "", url: "", tag: "S" });
  if (!open) return <button className="rx-btn ghost" onClick={() => setOpen(true)}>Aggiungi notizia a mano</button>;
  return (
    <div className="rx-form" style={{ marginTop: 10 }}>
      <label>Data<input type="date" className="rx-in" value={n.date} onChange={(e) => setN({ ...n, date: e.target.value })} /></label>
      <label>Tipo di fonte
        <select className="rx-in" value={n.tag} onChange={(e) => setN({ ...n, tag: e.target.value })}>
          {Object.entries(TAG_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
        </select>
      </label>
      <label className="full">Titolo<input className="rx-in" value={n.title} onChange={(e) => setN({ ...n, title: e.target.value })} /></label>
      <label className="full">Sintesi<input className="rx-in" value={n.summary} onChange={(e) => setN({ ...n, summary: e.target.value })} /></label>
      <label>Fonte<input className="rx-in" value={n.source} onChange={(e) => setN({ ...n, source: e.target.value })} /></label>
      <label>Link<input className="rx-in" value={n.url} onChange={(e) => setN({ ...n, url: e.target.value })} /></label>
      <div className="full" style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        <button className="rx-btn" onClick={() => setOpen(false)}>Annulla</button>
        <button
          className="rx-btn pri"
          disabled={!n.title.trim()}
          onClick={() => {
            onAdd({ ...n, id: uid() });
            setN({ date: todayISO(), title: "", summary: "", source: "", url: "", tag: "S" });
            setOpen(false);
          }}
        >
          Aggiungi notizia
        </button>
      </div>
    </div>
  );
}

function Detail({ d, onUpdate, onEdit, onDelete, onChange, busy, trends = [], onOpenTrend }) {
  const color = INSTR_COLOR[d.instrument] || INSTR_COLOR.Altro;
  const f = d.financials || {};
  const groups = SIDES.map((s) => [s, d.advisors.filter((a) => a.side === s)]).filter(([, l]) => l.length);
  const hasDebtorAdvisor = d.advisors.some((a) => a.side === "Debitore");

  return (
    <div>
      <div className="rx-dhead">
        <div className="rx-spine" style={{ background: color }} aria-hidden="true" />
        <div>
          <h2 className="rx-dname">{d.name}</h2>
          <div className="rx-dsub">
            <span>{d.sector || "Settore n.d."}</span>
            <span>Aggiornato il {fmtDate(d.updatedAt?.slice(0, 10))}</span>
          </div>
          <div className="rx-dact">
            <button className="rx-btn pri" onClick={() => onUpdate(d)} disabled={busy}>
              {busy ? "Ricerca notizie in corso…" : "Cerca aggiornamenti"}
            </button>
            <button className="rx-btn" onClick={() => onEdit(d)}>Modifica</button>
            <button className="rx-btn danger" onClick={() => onDelete(d)}>Elimina</button>
          </div>
        </div>
      </div>

      <section className="rx-sec" id="sec-strumento">
        <h3 className="rx-h">Procedura</h3>
        <dl className="rx-kv">
          <dt>Strumento</dt>
          <dd><span className="rx-chip" style={{ background: color, marginTop: 0 }}>{d.instrument}</span></dd>
          <dt>Tribunale / autorità</dt>
          <dd>{d.court || "n.d."}</dd>
          <dt>Fase</dt>
          <dd>{d.phase || "n.d."}</dd>
          <dt>Prossima scadenza</dt>
          <dd>
            {d.milestone?.date ? (
              <>
                {fmtDate(d.milestone.date)}{d.milestone.label ? ", " + d.milestone.label : ""}
                <Due date={d.milestone.date} />
              </>
            ) : (
              "n.d."
            )}
          </dd>
          <dt>Angolo di ingresso</dt>
          <dd>
            {(d.angle || []).length ? (
              <span style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {d.angle.map((a) => <span key={a} className="ew-chipfam" style={{ fontSize: 12.5, padding: "2px 9px", color: "var(--ink)" }}>{a}</span>)}
              </span>
            ) : "Da definire"}
            {d.angleNote && <div className="rx-note" style={{ marginTop: 4 }}>{d.angleNote}</div>}
          </dd>
          <dt>Interesse per AlixPartners</dt>
          <dd>
            {d.interest ? <b>{d.interest}</b> : "Da valutare"}
            {d.interestNote ? `, ${d.interestNote}` : ""}
            {(d.pitch || d.client) && (
              <span style={{ marginLeft: 8 }}>
                {d.pitch && <span className="rx-new">Pitch</span>}
                {d.client && <span className="rx-new">Client</span>}
              </span>
            )}
          </dd>
        </dl>
      </section>

      <section className="rx-sec" id="sec-fin">
        <h3 className="rx-h">Financials (mln €)</h3>
        <div className="rx-grid4 rx-num">
          <div className="rx-fig"><span>Ricavi</span><b>{fmtNum(f.revenue)}</b></div>
          <div className="rx-fig"><span>EBITDA</span><b>{fmtNum(f.ebitda)}</b></div>
          <div className="rx-fig"><span>Debito</span><b>{fmtNum(f.debt)}</b></div>
          <div className="rx-fig"><span>Debito / EBITDA</span><b>{leverage(f) || "n.d."}</b></div>
        </div>
        {(f.year || f.source || f.note) && (
          <div className="rx-note">
            {[f.year, f.source && "Fonte: " + f.source, f.note].filter(Boolean).join(". ")}
          </div>
        )}
      </section>

      <section className="rx-sec" id="sec-cred">
        <h3 className="rx-h">Principali creditori</h3>
        <CreditorTable d={d} />
      </section>

      <section className="rx-sec" id="sec-news">
        <h3 className="rx-h">Ultime notizie</h3>
        {d.news.length === 0 ? (
          <p style={{ margin: 0, color: "var(--muted)" }}>Nessuna notizia registrata. Usa Cerca aggiornamenti o importa un testo.</p>
        ) : (
          <ol className="rx-tl">
            {d.news.map((n) => (
              <li key={n.id}>
                <div className="rx-tdate rx-num">{fmtDate(n.date)}</div>
                <div>
                  <div className="rx-ttitle">
                    {n.url ? <a href={n.url} target="_blank" rel="noopener noreferrer">{n.title}</a> : n.title}
                  </div>
                  {n.summary && <div className="rx-tsum">{n.summary}</div>}
                  <div className="rx-tsrc">
                    <span className={"rx-tag " + n.tag} title={TAG_LABEL[n.tag]}>{n.tag}</span>
                    {NEW_PACK_IDS.includes(n.pack) && <span className="rx-new" style={{ marginLeft: 0 }}>Nuovo</span>}
                    <span>{n.source || "Fonte n.d."}</span>
                    <button
                      className="rx-btn ghost"
                      style={{ fontSize: 12 }}
                      onClick={() => onChange({ ...d, news: d.news.filter((x) => x.id !== n.id) })}
                    >
                      Rimuovi
                    </button>
                  </div>
                </div>
              </li>
            ))}
          </ol>
        )}
        <AddNews
          onAdd={(n) =>
            onChange({
              ...d,
              news: [...d.news, n].sort((a, b) => (b.date || "").localeCompare(a.date || "")),
              updatedAt: new Date().toISOString(),
            })
          }
        />
      </section>

      <section className="rx-sec" id="sec-adv">
        <h3 className="rx-h">Advisor e soggetti coinvolti</h3>
        {groups.length === 0 ? (
          <p style={{ margin: 0, color: "var(--muted)" }}>Nessun advisor registrato.</p>
        ) : (
          <div className="rx-adv">
            {groups.map(([side, list]) => (
              <div key={side}>
                <h4>{side}</h4>
                <ul>
                  {list.map((a, k) => (
                    <li key={k}>{a.name}{a.role && <span>{a.role}</span>}</li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        )}
        {!hasDebtorAdvisor && (
          <p className="rx-note">Advisor finanziario e legale del debitore: n.d.</p>
        )}
      </section>
      <section className="rx-sec" id="sec-macro">
        <h3 className="rx-h">Macrotrend rilevanti</h3>
        {trends.length === 0 ? (
          <p style={{ margin: 0, color: "var(--muted)" }}>Nessun macrotrend abbinato. Puoi assegnarli da Modifica.</p>
        ) : (
          <ul className="rx-mt">
            {trends.map((t) => (
              <li key={t.id}>
                <button className="rx-link" onClick={() => onOpenTrend && onOpenTrend(t.id)}>{t.title}</button>{" "}
                <span className={"rx-int " + t.intensity}>Intensità {t.intensity.toLowerCase()}</span>
                <div className="rx-note" style={{ marginTop: 3 }}>{t.mechanism}</div>
              </li>
            ))}
          </ul>
        )}
        <p className="rx-note">
          {d.trends && d.trends.length ? "Abbinamento manuale." : "Abbinamento automatico per settore e leva."}
        </p>
      </section>

    </div>
  );
}

function isNewDossier(d) {
  return (d.news || []).some((n) => NEW_PACK_IDS.includes(n.pack)) || (d.creditors || []).some((c) => NEW_PACK_IDS.includes(c.pack));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false;
  }
}

function CreditorTable({ d }) {
  const [copied, setCopied] = useState("");
  const list = d.creditors || [];
  if (!list.length)
    return <p style={{ margin: 0, color: "var(--muted)" }}>Nessun creditore registrato. Usa Cerca aggiornamenti, importa un testo o aggiungili da Modifica.</p>;
  const named = list.filter((c) => !c.generic);
  return (
    <>
      <div className="rx-ctab-wrap">
        <table className="rx-ctab">
          <thead>
            <tr>
              <th scope="col">Creditore</th>
              <th scope="col">Tipo</th>
              <th scope="col" className="rx-num">Esposizione (mln €)</th>
              <th scope="col">Nota e fonte</th>
            </tr>
          </thead>
          <tbody>
            {list.map((c, k) => (
              <tr key={k}>
                <td>
                  <b style={{ fontWeight: c.generic ? 500 : 600 }}>{c.name}</b>
                  {NEW_PACK_IDS.includes(c.pack) && <span className="rx-new">Nuovo</span>}
                </td>
                <td>{c.type}</td>
                <td className="rx-num">{fmtNum(c.exposure)}</td>
                <td>
                  {c.note}
                  <div className="rx-tsrc" style={{ marginTop: 2 }}>
                    <span className={"rx-tag " + (c.tag || "S")}>{c.tag || "S"}</span>
                    {c.url ? <a href={c.url} target="_blank" rel="noopener noreferrer" style={{ color: "var(--muted)" }}>{c.source || "Fonte"}</a> : <span>{c.source || "Fonte n.d."}</span>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 8 }}>
        <button
          className="rx-btn"
          disabled={!named.length}
          onClick={async () => {
            const ok = await copyText(named.map((c) => c.name).join("\n"));
            setCopied(ok ? "Nomi copiati negli appunti." : "Copia non riuscita in questo ambiente.");
          }}
        >
          Copia i nomi dei creditori
        </button>
        {copied && <span className="rx-note" style={{ marginTop: 0 }}>{copied}</span>}
      </div>
      <p className="rx-note">Le esposizioni sono quelle riportate dalla fonte alla data indicata nella nota; vanno verificate prima di un contatto.</p>
    </>
  );
}

function CreditorsView({ dossiers, onOpenDossier, onInfo }) {
  const [q, setQ] = useState("");
  const [fType, setFType] = useState("");
  const groups = useMemo(() => {
    const map = new Map();
    dossiers.forEach((d) =>
      (d.creditors || []).forEach((c) => {
        if (c.generic) return;
        const k = credKey(c.name);
        if (!k) return;
        if (!map.has(k)) map.set(k, { name: c.name, types: new Set(), rows: [] });
        const g = map.get(k);
        g.types.add(c.type);
        g.rows.push({ d, c });
      })
    );
    let arr = [...map.values()].map((g) => ({
      ...g,
      types: [...g.types],
      dossierCount: new Set(g.rows.map((r) => r.d.id)).size,
      total: g.rows.reduce((s, r) => s + (r.c.exposure != null ? Number(r.c.exposure) : 0), 0),
      hasExposure: g.rows.some((r) => r.c.exposure != null),
    }));
    const ql = q.trim().toLowerCase();
    if (ql) arr = arr.filter((g) => g.name.toLowerCase().includes(ql) || g.rows.some((r) => r.d.name.toLowerCase().includes(ql)));
    if (fType) arr = arr.filter((g) => g.types.includes(fType));
    return arr.sort((a, b) => b.dossierCount - a.dossierCount || b.total - a.total || a.name.localeCompare(b.name));
  }, [dossiers, q, fType]);

  const exportContacts = async () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["Creditore", "Tipo", "Dossier", "Strumento", "Esposizione mln €", "Nota", "Fonte", "Link", "Tipo fonte"];
    const rows = groups.flatMap((g) =>
      g.rows.map(({ d, c }) => [g.name, c.type, d.name, d.instrument, c.exposure ?? "", c.note || "", c.source || "", c.url || "", TAG_LABEL[c.tag] || c.tag || ""])
    );
    const csv = [head, ...rows].map((r) => r.map(esc).join(";")).join("\n");
    try {
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `creditori-restructuring-${todayISO()}.csv`;
      a.click();
      onInfo("Elenco creditori esportato in CSV.");
    } catch (e) {
      const ok = await copyText(csv);
      onInfo(ok ? "Download non disponibile: elenco copiato negli appunti." : "Esportazione non riuscita in questo ambiente.");
    }
  };

  return (
    <div className="rx-macro">
      <div className="rx-mhead">
        <div>
          <h2 className="rx-mtitle">Creditori per il business development</h2>
          <div className="rx-sub">
            {groups.length} creditori con nome, ordinati per numero di dossier in cui compaiono. I gruppi non nominati (es. "banche finanziatrici") restano solo nel dettaglio del dossier.
          </div>
        </div>
        <button className="rx-btn pri" onClick={exportContacts} disabled={!groups.length}>Esporta elenco per CRM</button>
      </div>
      <div className="rx-filters" style={{ paddingTop: 0 }}>
        <input className="rx-in grow" placeholder="Cerca un creditore o un dossier" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Cerca creditore" />
        <select className="rx-in" value={fType} onChange={(e) => setFType(e.target.value)} aria-label="Filtra per tipo">
          <option value="">Tutti i tipi</option>
          {CRED_TYPES.map((t) => <option key={t}>{t}</option>)}
        </select>
      </div>
      <div className="rx-mx">
        {groups.length === 0 ? (
          <p style={{ color: "var(--muted)" }}>Nessun creditore corrisponde alla ricerca.</p>
        ) : (
          <table className="rx-ctab">
            <thead>
              <tr>
                <th scope="col">Creditore</th>
                <th scope="col">Tipo</th>
                <th scope="col" className="rx-num">Dossier</th>
                <th scope="col" className="rx-num">Esposizione nota (mln €)</th>
                <th scope="col">Dove compare</th>
              </tr>
            </thead>
            <tbody>
              {groups.map((g) => (
                <tr key={g.name}>
                  <td><b>{g.name}</b></td>
                  <td>{g.types.join(", ")}</td>
                  <td className="rx-num"><b>{g.dossierCount}</b></td>
                  <td className="rx-num">{g.hasExposure ? fmtNum(g.total) : "n.d."}</td>
                  <td>
                    {g.rows.map(({ d, c }, k) => (
                      <div key={k} style={{ padding: "2px 0" }}>
                        <button className="rx-link" onClick={() => onOpenDossier(d.id)}>{d.name}</button>
                        <span className="rx-ev">{d.instrument}{c.exposure != null ? `, ${fmtNum(c.exposure)} mln` : ""}{c.note ? `. ${c.note}` : ""}</span>
                      </div>
                    ))}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function SourceLine({ source, url, tag }) {
  return (
    <span className="rx-ev">
      <span className={"rx-tag " + tag} title={TAG_LABEL[tag]}>{tag}</span>{" "}
      {url ? <a href={url} target="_blank" rel="noopener noreferrer">{source}</a> : source}
    </span>
  );
}

function trendArticles(t) {
  const out = [];
  [...(t.articles || []), ...(t.signals || [])].forEach((a) => {
    if (!a || !a.title) return;
    if (out.some((x) => (a.url && x.url === a.url) || x.title.toLowerCase() === a.title.toLowerCase())) return;
    out.push(a);
  });
  return out.sort((a, b) => (b.date || "0000").localeCompare(a.date || "0000"));
}

function ArticleItem({ a, extra }) {
  return (
    <li className="rx-art">
      <div className="rx-tdate rx-num">{a.date ? fmtDate(a.date) : "Data n.d."}</div>
      <div>
        <div className="rx-ttitle">
          {a.url ? (
            <a href={a.url} target="_blank" rel="noopener noreferrer">{a.title}</a>
          ) : (
            a.title
          )}
        </div>
        {a.summary && <div className="rx-tsum">{a.summary}</div>}
        <div className="rx-tsrc">
          <span className={"rx-tag " + (a.tag || "S")} title={TAG_LABEL[a.tag || "S"]}>{a.tag || "S"}</span>
          <span>{a.source || "Fonte n.d."}</span>
          {extra}
          {a.url && (
            <a className="rx-read" href={a.url} target="_blank" rel="noopener noreferrer">Leggi l'articolo</a>
          )}
        </div>
      </div>
    </li>
  );
}

function TrendArticles({ t, exposed, onOpenDossier, onSearch, busy }) {
  const [showAll, setShowAll] = useState(false);
  const list = trendArticles(t);
  const shown = showAll ? list : list.slice(0, 6);
  const fromDossiers = exposed
    .flatMap((d) => d.news.map((n) => ({ ...n, _d: d })))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 5);
  return (
    <div className="rx-arts">
      <div className="rx-arts-head">
        <h4 style={{ margin: 0 }}>Articoli da leggere ({list.length})</h4>
        <button className="rx-btn" onClick={onSearch} disabled={busy}>
          {busy ? "Ricerca in corso…" : "Cerca nuovi articoli"}
        </button>
      </div>
      {list.length ? (
        <ol className="rx-tl">
          {shown.map((a) => <ArticleItem key={a.id || a.url || a.title} a={a} />)}
        </ol>
      ) : (
        <p style={{ color: "var(--muted)" }}>Nessun articolo salvato. Usa Cerca nuovi articoli per trovare le notizie degli ultimi 30 giorni.</p>
      )}
      {list.length > 6 && (
        <button className="rx-btn ghost" onClick={() => setShowAll((v) => !v)}>
          {showAll ? "Mostra meno" : `Mostra tutti i ${list.length} articoli`}
        </button>
      )}
      {fromDossiers.length > 0 && (
        <>
          <h4 style={{ marginTop: 18 }}>Dalle notizie dei dossier esposti</h4>
          <ol className="rx-tl">
            {fromDossiers.map((n) => (
              <ArticleItem
                key={n._d.id + n.id}
                a={n}
                extra={<button className="rx-link" style={{ fontSize: 12.5 }} onClick={() => onOpenDossier(n._d.id)}>{n._d.name}</button>}
              />
            ))}
          </ol>
        </>
      )}
    </div>
  );
}

function MacroView({ macro, dossiers, openTrend, setOpenTrend, onOpenDossier, onUpdateIndicators, onTrendSignals, busy, busyTrend }) {
  const exposure = (t) => dossiers.filter((d) => trendsFor(d, macro.trends).some((x) => x.id === t.id));
  const rows = dossiers
    .map((d) => ({ d, ids: trendsFor(d, macro.trends).map((t) => t.id) }))
    .sort((a, b) => b.ids.length - a.ids.length || a.d.name.localeCompare(b.d.name));

  return (
    <div className="rx-macro">
      <div className="rx-mhead">
        <div>
          <h2 className="rx-mtitle">Cruscotto macro</h2>
          <div className="rx-sub">
            Indicatori aggiornati al {fmtDate(macro.updatedAt?.slice(0, 10))}. Il giudizio sul rischio è una nostra valutazione.
          </div>
        </div>
        <button className="rx-btn pri" onClick={onUpdateIndicators} disabled={busy}>
          {busy ? "Ricerca dei dati in corso…" : "Aggiorna indicatori"}
        </button>
      </div>

      <div className="rx-ind">
        {macro.indicators.map((i) => (
          <div className="rx-indc" key={i.id}>
            <div className="lab">{i.label}</div>
            <div className="val rx-num">{i.value}</div>
            {i.prior && <div className="pri rx-num">Precedente: {i.prior}</div>}
            <span className={"rx-risk " + i.risk}>{RISK_LABEL[i.risk] || ""}</span>
            {i.note && <div className="nt">{i.note}</div>}
            <div className="src">
              <span>{fmtDate(i.date)}</span>
              <SourceLine source={i.source} url={i.url} tag={i.tag} />
            </div>
          </div>
        ))}
      </div>

      <div className="rx-sec" style={{ borderTop: 0 }}>
        <h3 className="rx-h" style={{ marginBottom: 2 }}>Macrotrend che possono generare restructuring</h3>
        <p className="rx-note" style={{ marginTop: 0 }}>
          Intensità, meccanismi, leve e segnali da monitorare sono nostre valutazioni. Le evidenze riportano la fonte.
        </p>
      </div>

      {macro.trends.map((t) => {
        const open = openTrend === t.id;
        const exp = exposure(t);
        return (
          <div className="rx-trend" key={t.id} id={"trend-" + t.id}>
            <button className="rx-trow" aria-expanded={open} onClick={() => setOpenTrend(open ? null : t.id)}>
              <div className="rx-spine" style={{ background: INT_COLOR[t.intensity] }} aria-hidden="true" />
              <div>
                <div className="rx-tname">{t.title}</div>
                <div className="rx-tmeta">{t.sectors.join(", ")}</div>
              </div>
              <div className="rx-rright">
                <span className={"rx-int " + t.intensity}>Intensità {t.intensity.toLowerCase()}</span>
                <div style={{ marginTop: 6 }}>Orizzonte {t.horizon}</div>
                <div>{exp.length === 1 ? "1 dossier esposto" : exp.length + " dossier esposti"}</div>
                <div>{trendArticles(t).length} articoli</div>
              </div>
            </button>
            {open && (
              <div className="rx-tbody">
                <div className="full">
                  <h4>Meccanismo di trasmissione</h4>
                  <p>{t.mechanism}</p>
                </div>
                <div className="full">
                  <TrendArticles t={t} exposed={exp} onOpenDossier={onOpenDossier} onSearch={() => onTrendSignals(t)} busy={busyTrend === t.id} />
                </div>
                <div className="full">
                  <h4>Evidenze</h4>
                  <ul>
                    {t.evidence.map((e, k) => (
                      <li key={k}>{e.text} <SourceLine source={e.source} url={e.url} tag={e.tag} /></li>
                    ))}
                  </ul>
                </div>
                <div>
                  <h4>Leve di restructuring</h4>
                  <ul>{t.levers.map((l, k) => <li key={k}>{l}</li>)}</ul>
                </div>
                <div>
                  <h4>Segnali da monitorare</h4>
                  <ul>{t.watch.map((l, k) => <li key={k}>{l}</li>)}</ul>
                </div>
                <div className="full">
                  <h4>Dossier esposti</h4>
                  {exp.length ? (
                    <ul>
                      {exp.map((d) => (
                        <li key={d.id}>
                          <button className="rx-link" onClick={() => onOpenDossier(d.id)}>{d.name}</button>
                          <span className="rx-ev">{d.sector}</span>
                        </li>
                      ))}
                    </ul>
                  ) : (
                    <p style={{ color: "var(--muted)" }}>Nessun dossier esposto. Puoi abbinarlo manualmente da Modifica nel dossier.</p>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div className="rx-sec" style={{ borderTop: 0 }}>
        <h3 className="rx-h" style={{ marginBottom: 2 }}>Esposizione del portafoglio</h3>
        <p className="rx-note" style={{ marginTop: 0 }}>Quanti macrotrend toccano ciascun dossier seguito. Clicca un nome per aprirlo.</p>
      </div>
      <div className="rx-mx">
        <table>
          <thead>
            <tr>
              <th scope="col">Dossier</th>
              {macro.trends.map((t) => <th scope="col" key={t.id}>{t.short}</th>)}
              <th scope="col">Totale</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(({ d, ids }) => (
              <tr key={d.id}>
                <td><button className="rx-link" onClick={() => onOpenDossier(d.id)}>{d.name}</button></td>
                {macro.trends.map((t) => (
                  <td key={t.id}>
                    {ids.includes(t.id) ? (
                      <span className="rx-dot" style={{ background: INT_COLOR[t.intensity] }} title={`${d.name}: esposto a ${t.short}`} />
                    ) : (
                      <span className="rx-dot off" aria-label="non esposto" />
                    )}
                  </td>
                ))}
                <td className="rx-num"><b>{ids.length}</b></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Icon({ name, size = 18 }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true };
  if (name === "dots")
    return (
      <svg {...common} fill="currentColor" stroke="none">
        <circle cx="5" cy="12" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="19" cy="12" r="2" />
      </svg>
    );
  if (name === "close") return <svg {...common}><path d="M6 6l12 12M18 6L6 18" /></svg>;
  if (name === "chev") return <svg {...common}><path d="M9 6l6 6-6 6" /></svg>;
  if (name === "prev") return <svg {...common}><path d="M15 6l-6 6 6 6" /></svg>;
  return null;
}

function ActionsMenu({ items }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === "Escape" && setOpen(false);
    const onClick = (e) => !e.target.closest(".rx-menuwrap") && setOpen(false);
    document.addEventListener("keydown", onKey);
    document.addEventListener("mousedown", onClick);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("mousedown", onClick);
    };
  }, [open]);
  return (
    <div className="rx-menuwrap">
      <button className="rx-kebab" aria-haspopup="menu" aria-expanded={open} aria-label="Altre azioni" onClick={() => setOpen((o) => !o)}>
        <Icon name="dots" />
      </button>
      {open && (
        <div className="rx-menu" role="menu">
          {items.map((it, k) =>
            it.sep ? (
              <div key={k} className="rx-mi-sep" role="separator" />
            ) : (
              <button
                key={k}
                role="menuitem"
                className="rx-mi"
                disabled={it.disabled}
                onClick={() => {
                  setOpen(false);
                  it.onClick();
                }}
              >
                <span>{it.label}</span>
                {it.hint && <small>{it.hint}</small>}
              </button>
            )
          )}
        </div>
      )}
    </div>
  );
}

function fmtMln(v) {
  if (!v) return "0";
  return v >= 1000 ? (v / 1000).toLocaleString("it-IT", { maximumFractionDigits: 1 }) + " mld" : Math.round(v).toLocaleString("it-IT") + " mln";
}

function Overview({ dossiers, fInstr, onInstr, onOpen }) {
  const total = dossiers.length;
  if (!total) return null;
  const debtOf = (d) => (d.financials && d.financials.debt != null && isFinite(Number(d.financials.debt)) ? Number(d.financials.debt) : 0);
  const debtTot = dossiers.reduce((s, d) => s + debtOf(d), 0);
  const withDebt = dossiers.filter((d) => debtOf(d) > 0).length;
  const dated = dossiers
    .filter((d) => d.milestone && d.milestone.date)
    .map((d) => ({ d, n: daysUntil(d.milestone.date) }))
    .filter((x) => x.n !== null);
  const soon = dated.filter((x) => x.n >= 0 && x.n <= 30).length;
  const late = dated.filter((x) => x.n < 0).length;
  const fresh = dossiers.filter(isNewDossier).length;
  const counts = INSTRUMENTS.map((i) => [i, dossiers.filter((x) => x.instrument === i).length]).filter(([, n]) => n > 0);
  const topDebt = [...dossiers].filter((d) => debtOf(d) > 0).sort((a, b) => debtOf(b) - debtOf(a)).slice(0, 8);
  const maxD = topDebt.length ? debtOf(topDebt[0]) : 1;
  const next = [...dated].filter((x) => x.n >= -14).sort((a, b) => a.n - b.n).slice(0, 6);
  const R = 42;
  const C = 2 * Math.PI * R;
  let acc = 0;
  return (
    <section className="ov" aria-label="Panoramica">
      <div className="ov-kpis">
        <div className="ov-kpi" style={{ "--c": "#1D5C8A" }}>
          <span>Dossier seguiti</span><b>{total}</b><em>{counts.length} strumenti diversi</em>
        </div>
        <div className="ov-kpi" style={{ "--c": "#6A4FA0" }}>
          <span>Debito aggregato</span><b>{fmtMln(debtTot)}</b><em>su {withDebt} dossier con dato</em>
        </div>
        <div className="ov-kpi" style={{ "--c": "#B5791C" }}>
          <span>Scadenze entro 30 gg</span><b>{soon}</b><em>{late ? late + " già scadute" : "nessuna scaduta"}</em>
        </div>
        <div className="ov-kpi" style={{ "--c": "#1E7A78" }}>
          <span>Novità ultimo aggiornamento</span><b>{fresh}</b><em>dossier con notizie nuove</em>
        </div>
      </div>
      <div className="ov-charts">
        <div className="ov-card">
          <h3>Per strumento</h3>
          <div className="ov-donut">
            <svg viewBox="0 0 120 120" role="img" aria-label="Distribuzione dei dossier per strumento">
              {counts.map(([i, n]) => {
                const len = (n / total) * C;
                const el = (
                  <circle key={i} cx="60" cy="60" r={R} fill="none" stroke={INSTR_COLOR[i]} strokeWidth="16"
                    strokeDasharray={Math.max(len - 1.5, 0) + " " + C} strokeDashoffset={-acc}
                    transform="rotate(-90 60 60)" opacity={fInstr && fInstr !== i ? 0.22 : 1}
                    onClick={() => onInstr(fInstr === i ? "" : i)} />
                );
                acc += len;
                return el;
              })}
              <text x="60" y="62" textAnchor="middle">{total}</text>
              <text className="s" x="60" y="74" textAnchor="middle">dossier</text>
            </svg>
            <ul className="ov-leg">
              {counts.map(([i, n]) => (
                <li key={i}>
                  <button aria-pressed={fInstr === i} onClick={() => onInstr(fInstr === i ? "" : i)}>
                    <i style={{ background: INSTR_COLOR[i] }} />{i}<b>{n}</b>
                  </button>
                </li>
              ))}
            </ul>
          </div>
        </div>
        <div className="ov-card">
          <h3>Maggiore esposizione debitoria</h3>
          {topDebt.length ? (
            <div className="ov-bars">
              {topDebt.map((d) => (
                <button key={d.id} className="ov-bar" onClick={() => onOpen(d.id)} aria-label={"Apri " + d.name}>
                  <span>{d.name}</span>
                  <u><i style={{ width: Math.max(3, (debtOf(d) / maxD) * 100) + "%", background: INSTR_COLOR[d.instrument] || INSTR_COLOR.Altro }} /></u>
                  <b>{fmtMln(debtOf(d))}</b>
                </button>
              ))}
            </div>
          ) : <div className="ov-empty">Nessun dato sul debito disponibile.</div>}
        </div>
        <div className="ov-card">
          <h3>Prossime scadenze</h3>
          {next.length ? (
            <ul className="ov-dl">
              {next.map(({ d, n }) => (
                <li key={d.id}>
                  <button onClick={() => onOpen(d.id)} aria-label={"Apri " + d.name}>
                    <span className={"ov-day" + (n < 0 ? " late" : n > 45 ? " far" : "")}>
                      <b>{Math.abs(n)}</b><small>{n < 0 ? "gg fa" : n === 0 ? "oggi" : "giorni"}</small>
                    </span>
                    <span style={{ minWidth: 0 }}>
                      <strong>{d.name}</strong>
                      <em>{fmtDate(d.milestone.date)}, {d.milestone.label}</em>
                    </span>
                  </button>
                </li>
              ))}
            </ul>
          ) : <div className="ov-empty">Nessuna scadenza in programma.</div>}
        </div>
      </div>
    </section>
  );
}

function WatchRow({ d, onOpen, maxDebt }) {
  const color = INSTR_COLOR[d.instrument] || INSTR_COLOR.Altro;
  const f = d.financials || {};
  const lev = leverage(f);
  const last = d.news[0];
  const nCred = (d.creditors || []).filter((c) => !c.generic).length;
  return (
    <button className="rx-wr" onClick={() => onOpen(d.id)} aria-label={`Apri il dossier ${d.name}`}>
      <span className="rx-wr-spine" style={{ background: color }} aria-hidden="true" />
      <span className="rx-c">
        <span className="rx-wr-name">{d.name}</span>
        <span className="rx-wr-sub">
          {d.sector || "Settore n.d."}
          {isNewDossier(d) && <span className="rx-new">Novità</span>}
        </span>
      </span>
      <span className="rx-c">
        <span className="rx-chip" style={{ background: color, marginTop: 0 }}>{d.instrument}</span>
        <span className="rx-wr-sub clamp">{d.phase || "Fase n.d."}</span>
        {(d.angle || []).length > 0 && <span className="rx-wr-sub" style={{ color: "var(--ink)" }}>Angolo: {d.angle.join(", ")}</span>}
      </span>
      <span className="rx-c rx-num">
        <span className="rx-wr-fig">{f.debt != null ? <>{fmtNum(f.debt)}<small> mln</small></> : "n.d."}</span>
        <span className="rx-wr-sub">{lev ? `leva ${lev}` : f.debt != null ? "debito" : ""}</span>
        {f.debt != null && maxDebt > 0 && (
          <span className="rx-meter" aria-hidden="true"><i style={{ width: Math.max(4, (Number(f.debt) / maxDebt) * 100) + "%", background: color }} /></span>
        )}
      </span>
      <span className="rx-c">
        {d.milestone?.date ? (
          <>
            <span className="rx-wr-date rx-num">
              {fmtDate(d.milestone.date)}
              <Due date={d.milestone.date} />
            </span>
            <span className="rx-wr-sub clamp">{d.milestone.label}</span>
          </>
        ) : (
          <span className="rx-wr-sub">Nessuna scadenza</span>
        )}
      </span>
      <span className="rx-c rx-hide-m">
        {last ? (
          <>
            <span className="rx-wr-news clamp">{last.title}</span>
            <span className="rx-wr-sub">{fmtDate(last.date)}, {last.source || "fonte n.d."}</span>
          </>
        ) : (
          <span className="rx-wr-sub">Nessuna notizia</span>
        )}
      </span>
      <span className="rx-c rx-num rx-hide-m">
        <span className="rx-wr-fig">{nCred || "n.d."}</span>
        <span className="rx-wr-sub">creditori</span>
      </span>
      <span className="rx-wr-chev" aria-hidden="true"><Icon name="chev" /></span>
    </button>
  );
}

const DOSSIER_SECTIONS = [["sec-strumento", "Procedura"], ["sec-fin", "Financials"], ["sec-cred", "Creditori"], ["sec-news", "Notizie"], ["sec-adv", "Advisor"], ["sec-macro", "Macrotrend"]];

function Drawer({ title, onClose, onPrev, onNext, blocked, children, sections = DOSSIER_SECTIONS }) {
  useEffect(() => {
    const onKey = (e) => {
      if (blocked) return;
      if (e.key === "Escape") onClose();
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose, blocked]);
  return (
    <div className="rx-dov" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <aside className="rx-drawer" role="dialog" aria-modal="true" aria-label={`Dossier ${title}`}>
        <div className="rx-dbar">
          <div style={{ display: "flex", gap: 4 }}>
            <button className="rx-iconbtn" onClick={onPrev} disabled={!onPrev} aria-label="Dossier precedente"><Icon name="prev" /></button>
            <button className="rx-iconbtn" onClick={onNext} disabled={!onNext} aria-label="Dossier successivo"><Icon name="chev" /></button>
          </div>
          <nav className="rx-jump" aria-label="Vai alla sezione">
            {sections.map(([id, l]) => (
              <button key={id} onClick={() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" })}>{l}</button>
            ))}
          </nav>
          <button className="rx-iconbtn" onClick={onClose} aria-label="Chiudi"><Icon name="close" /></button>
        </div>
        {children}
      </aside>
    </div>
  );
}

];
const bandOf = (sc) => [...BANDS].reverse().find((b) => sc >= b.min) || BANDS[0];

function monthsBetween(a, b) {
  const da = new Date((a || "").slice(0, 10) + "T00:00:00");
  const db = new Date((b || "").slice(0, 10) + "T00:00:00");
  if (isNaN(da) || isNaN(db)) return null;
  return (db - da) / (86400000 * 30.44);
}

function ewImplicit(company, trends) {
  return trendsFor(company, trends).map((t) => ({
    id: "imp-" + t.id,
    family: "ctx",
    title: `Esposizione al macrotrend: ${t.short}`,
    value: t.title,
    date: todayISO(),
    source: "Macrotrend della Watchlist",
    url: "",
    tag: "I",
    severity: t.intensity === "Alta" ? 2 : 1,
    implicit: true,
  }));
}

function ewScore(company, weights, trends, asOf = todayISO()) {
  const w = weights || DEFAULT_WEIGHTS;
  const all = [...(company.signals || []), ...(trends ? ewImplicit(company, trends) : [])];
  const parts = all.map((s) => {
    const age = monthsBetween(s.date, asOf);
    if (age === null || age < -0.01) return { s, v: 0 };
    const d = age <= w.plateau ? 1 : Math.max(0, 1 - (age - w.plateau) / Math.max(1, w.horizon - w.plateau));
    let mult = w.fam[s.family] ?? 1;
    if (s.family === "op" && company.type === "Branch di multinazionale") mult *= w.branch;
    return { s, v: (SEV_PTS[s.severity] || 0) * mult * d };
  });
  const total = Math.min(100, parts.reduce((a, p) => a + p.v, 0));
  const byFam = FAMILIES.map((f) => ({ ...f, v: parts.filter((p) => p.s.family === f.id).reduce((a, p) => a + p.v, 0) }));
  return { score: Math.round(total), parts: parts.filter((p) => p.v > 0.05).sort((a, b) => b.v - a.v), byFam };
}

function applyEwPacks(companies, applied = []) {
  let cs = JSON.parse(JSON.stringify(companies));
  const done = [];
  let nPatched = 0;
  let nAdded = 0;
  EW_PACKS.filter((p) => !applied.includes(p.id)).forEach((p) => {
    (p.patches || []).forEach((pt) => {
      const c = cs.find((x) => x.id === pt.id);
      if (!c) return;
      (pt.addSignals || []).forEach((sg) => {
        if (!c.signals.some((x) => x.title === sg.title)) c.signals.push({ ...sg, id: c.id + "-" + uid(), addedAt: sg.addedAt || todayISO() });
      });
      if (pt.fields) {
        const { financials, ...rest } = pt.fields;
        Object.assign(c, rest);
        if (financials) {
          const cur = c.financials || {};
          c.financials = { ...cur, ...Object.fromEntries(Object.entries(financials).filter(([k, v]) => v != null || cur[k] == null)) };
        }
      }
      nPatched++;
    });
    (p.removeIds || []).forEach((rid) => {
      const k = cs.findIndex((x) => x.id === rid);
      if (k >= 0) cs.splice(k, 1);
    });
    (p.add || []).forEach((nc) => {
      if (!cs.some((x) => x.id === nc.id || x.name.toLowerCase() === nc.name.toLowerCase())) {
        cs.push(nc);
        nAdded++;
      }
    });
    done.push(p.id);
  });
  return { cs, done, nPatched, nAdded };
}

function addMonths(iso, m) {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + m);
  return d.toISOString().slice(0, 10);
}

function buildEwProposal(c, r, forceTag) {
  const items = [];
  (r.signals || []).forEach((s) => {
    if (!s || !s.title || !FAM_LABEL[s.family]) return;
    const dup = c.signals.some((x) => (s.url && x.url === s.url && x.title === s.title) || x.title.toLowerCase() === s.title.toLowerCase());
    if (!dup)
      items.push({
        id: uid(),
        kind: "ewsig",
        on: true,
        value: {
          id: uid(),
          family: s.family,
          title: s.title,
          value: s.value || "",
          date: s.date || todayISO(),
          source: s.source || "",
          url: s.url || "",
          tag: forceTag || (s.tag === "F" ? "F" : "S"),
          severity: [1, 2, 3].includes(Number(s.severity)) ? Number(s.severity) : 1,
          addedAt: todayISO(),
        },
      });
  });
  const f = r.financials;
  if (f)
    ["revenue", "ebitda", "debt"].forEach((k) => {
      if (f[k] != null && isFinite(Number(f[k])) && Number(f[k]) !== Number(c.financials?.[k]))
        items.push({ id: uid(), kind: "fin", key: k, on: c.financials?.[k] == null, value: Number(f[k]), old: c.financials?.[k], meta: { year: f.year, source: f.source } });
    });
  (r.creditors || []).forEach((cr) => {
    if (cr && cr.name && !(c.creditors || []).some((x) => credKey(x.name) === credKey(cr.name)))
      items.push({
        id: uid(),
        kind: "cred",
        on: true,
        value: { name: cr.name, type: CRED_TYPES.includes(cr.type) ? cr.type : "Altro", exposure: cr.exposure != null && isFinite(Number(cr.exposure)) ? Number(cr.exposure) : null, note: cr.note || "", source: forceTag === "DW" ? "Debtwire" : "Ricerca web", url: "", tag: forceTag || "S" },
      });
  });
  return items;
}

function applyEwProposal(c, items, weights, trends) {
  const nc = JSON.parse(JSON.stringify(c));
  nc.prevScore = ewScore(c, weights, trends).score;
  nc.financials = nc.financials || {};
  items
    .filter((i) => i.on)
    .forEach((i) => {
      if (i.kind === "ewsig") nc.signals.push(i.value);
      if (i.kind === "fin") {
        nc.financials[i.key] = i.value;
        if (i.meta?.year) nc.financials.year = i.meta.year;
        if (i.meta?.source) nc.financials.source = i.meta.source;
      }
      if (i.kind === "cred") nc.creditors = [...(nc.creditors || []), i.value];
    });
  nc.signals.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  nc.updatedAt = new Date().toISOString();
  return nc;
}

  const [cred, setCred] = useState(() => (initial.creditors || []).map((x) => [x.name, x.type, x.exposure ?? "", x.note || ""].join(" | ")).join("\n"));

  const set = (k, v) => setC((p) => ({ ...p, [k]: v }));
  const setF = (k, v) => setC((p) => ({ ...p, financials: { ...p.financials, [k]: v } }));
  const num = (v) => (v === "" || v == null ? null : isFinite(Number(String(v).replace(",", "."))) ? Number(String(v).replace(",", ".")) : null);
  const save = () => {
    if (!c.name.trim()) return;
    onSave({
      ...c,
      name: c.name.trim(),
      financials: { ...c.financials, revenue: num(c.financials.revenue), ebitda: num(c.financials.ebitda), debt: num(c.financials.debt) },
      creditors: cred.split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((p) => p[0]).map((p) => {
        const prev = (initial.creditors || []).find((x) => credKey(x.name) === credKey(p[0]));
        const ex = num(p[2]);
        return { ...(prev || { source: "Inserimento manuale", url: "", tag: "I" }), name: p[0], type: CRED_TYPES.includes(p[1]) ? p[1] : "Altro", exposure: ex, note: p[3] || "" };
      }),
      bd: bd.split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((p) => p[0]).map((p) => ({ name: p[0], role: p[1] || "", note: p[2] || "" })),
      updatedAt: new Date().toISOString(),
    });
  };
  return (
    <div className="rx-ov" role="dialog" aria-modal="true" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="rx-modal">
        <h3>{initial.name ? "Modifica azienda" : "Nuova azienda"}</h3>
        <p className="lead">Importi in milioni di euro. I segnali si aggiungono dalla scheda dell'azienda.</p>
        <div className="rx-form">
          <label className="full">Azienda<input className="rx-in" value={c.name} onChange={(e) => set("name", e.target.value)} autoFocus /></label>
          <label>Settore<input className="rx-in" value={c.sector} onChange={(e) => set("sector", e.target.value)} /></label>
          <label>Tipo
            <select className="rx-in" value={c.type} onChange={(e) => set("type", e.target.value)}>
              {COMPANY_TYPES.map((t) => <option key={t}>{t}</option>)}
            </select>
          </label>
          <label>Proprietà<input className="rx-in" value={c.owner || ""} onChange={(e) => set("owner", e.target.value)} /></label>
          <label>Fatturato oltre 100 mln €<input className="rx-in" value={c.revenueCheck || ""} onChange={(e) => set("revenueCheck", e.target.value)} placeholder="verificato / da verificare" /></label>
          <label>Ricavi<input className="rx-in rx-num" value={c.financials.revenue ?? ""} onChange={(e) => setF("revenue", e.target.value)} /></label>
          <label>EBITDA<input className="rx-in rx-num" value={c.financials.ebitda ?? ""} onChange={(e) => setF("ebitda", e.target.value)} /></label>
          <label>Debito<input className="rx-in rx-num" value={c.financials.debt ?? ""} onChange={(e) => setF("debt", e.target.value)} /></label>
          <label>Periodo<input className="rx-in" value={c.financials.year || ""} onChange={(e) => setF("year", e.target.value)} /></label>
          <label>Fonte dei financials<input className="rx-in" value={c.financials.source || ""} onChange={(e) => setF("source", e.target.value)} /></label>
          <label>Nota<input className="rx-in" value={c.financials.note || ""} onChange={(e) => setF("note", e.target.value)} /></label>
          <label className="full">Creditori noti, uno per riga: Nome | Tipo | Esposizione mln € | Nota
            <textarea className="rx-in" value={cred} onChange={(e) => setCred(e.target.value)} />
          </label>
          <label className="full">Interlocutori per il business development, uno per riga: Nome | Ruolo | Nota
            <textarea className="rx-in" value={bd} onChange={(e) => setBd(e.target.value)} />
          </label>
          <label className="full">Note<textarea className="rx-in" value={c.notes || ""} onChange={(e) => set("notes", e.target.value)} /></label>
          {allTrends.length > 0 && (
            <fieldset className="full rx-fs">
              <legend>Macrotrend rilevanti. Se non ne selezioni nessuno, l'abbinamento è automatico per settore</legend>
              {allTrends.map((t) => {
                const on = (c.trends || []).includes(t.id);
                return (
                  <label key={t.id} className="rx-chk">
                    <input type="checkbox" checked={on} onChange={() => set("trends", on ? c.trends.filter((x) => x !== t.id) : [...(c.trends || []), t.id])} />
                    {t.title}

                );
              })}
            </fieldset>
          )}
        </div>
        <div className="rx-mfoot">
          <button className="rx-btn" onClick={onClose}>Annulla</button>
          <button className="rx-btn pri" onClick={save} disabled={!c.name.trim()}>Salva azienda</button>
        </div>
      </div>
    </div>
  );
}

            {c.bd.map((x, k) => (
              <li key={k}><b>{x.name}</b>{x.role && <span className="rx-ev">{x.role}</span>}{x.note && <div className="rx-note" style={{ marginTop: 2 }}>{x.note}</div>}</li>

}
