const EW_SECTIONS = [["ew-score", "Punteggio"], ["ew-why", "Perché"], ["ew-signals", "Segnali"], ["ew-fin", "Financials"], ["ew-cred", "Creditori"], ["ew-bd", "Interlocutori"]];

function EarlyWarning({ macro, onPromote, onInfo, onError }) {
  const [companies, setCompanies] = useState([]);
  const [weights, setWeights] = useState(DEFAULT_WEIGHTS);
  const [packs, setPacks] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("rank");
  const [q, setQ] = useState("");
  const [fSector, setFSector] = useState("");
  const [fBand, setFBand] = useState("");
  const [selId, setSelId] = useState(null);
  const [edit, setEdit] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [importBusy, setImportBusy] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [progress, setProgress] = useState(null);
  const [reviews, setReviews] = useState([]);
  const trends = macro.trends;

  useEffect(() => {
    (async () => {
      try {
        const r = window.storage ? await window.storage.get(EW_KEY, false) : null;
        const v = r && r.value ? JSON.parse(r.value) : {};
        const res = applyEwPacks(v.companies || EW_SEED, v.packs || []);
        setCompanies(res.cs);
        setWeights(v.weights || DEFAULT_WEIGHTS);
        setPacks([...(v.packs || []), ...res.done]);
        if (res.done.length) onInfo(`Dati Aida integrati: fatturato verificato per ${res.nPatched} aziende e ${res.nAdded} nuovi candidati dallo screening sui bilanci fermi al 2023.`);
      } catch (e) {
        const res = applyEwPacks(EW_SEED, []);
        setCompanies(res.cs);
        setPacks(res.done);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded || !window.storage) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set(EW_KEY, JSON.stringify({ companies, weights, packs }), false);
      } catch (e) {
        onError("Salvataggio dell'Early Warning non riuscito: i dati restano solo in questa sessione.");
      }
    }, 400);
    return () => clearTimeout(t);
  }, [companies, weights, packs, loaded]);

  const scored = useMemo(() => companies.map((c) => ({ c, r: ewScore(c, weights, trends) })), [companies, weights, trends]);
  const sectors = useMemo(() => [...new Set(companies.map((c) => c.sector).filter(Boolean))].sort(), [companies]);
  const visible = useMemo(() => {
    const ql = q.trim().toLowerCase();
    return scored
      .filter(({ c, r }) => {
        if (fSector && c.sector !== fSector) return false;
        if (fBand && bandOf(r.score).id !== fBand) return false;
        if (!ql) return true;
        return [c.name, c.sector, c.owner, ...c.signals.map((s) => s.title), ...(c.creditors || []).map((x) => x.name)].join(" ").toLowerCase().includes(ql);
      })
      .sort((a, b) => b.r.score - a.r.score || a.c.name.localeCompare(b.c.name));
  }, [scored, q, fSector, fBand]);

  const selected = companies.find((c) => c.id === selId) || null;
  const idx = selected ? visible.findIndex((x) => x.c.id === selected.id) : -1;
  const replace = (nc) => setCompanies((p) => p.map((c) => (c.id === nc.id ? nc : c)));

  const runSearch = async (c) => {
    setBusyId(c.id);
    try {
      const r = await callClaude(ewSignalsPrompt(c), true);
      const items = buildEwProposal(c, r);
      if (items.length) setReviews([{ kind: "ew", company: c, title: "Nuovi segnali: " + c.name, items, isNew: false }]);
      else onInfo(`Nessun segnale nuovo trovato per ${c.name}.`);
    } catch (e) {
      onError(`Ricerca su ${c.name} non riuscita: ${e.message}`);
    }
    setBusyId(null);
  };

  const runSearchAll = async () => {
    const list = visible.map((x) => x.c).filter((c) => !c.promoted);
    const out = [];
    for (let i = 0; i < list.length; i++) {
      setProgress({ i: i + 1, n: list.length, name: list[i].name });
      try {
        const r = await callClaude(ewSignalsPrompt(list[i]), true);
        const items = buildEwProposal(list[i], r);
        if (items.length) out.push({ kind: "ew", company: list[i], title: "Nuovi segnali: " + list[i].name, items, isNew: false });
      } catch (e) {
        /* prosegue con l'azienda successiva */
      }
    }
    setProgress(null);
    if (out.length) setReviews(out);
    else onInfo("Nessun segnale nuovo trovato per le aziende visibili.");
  };

  const runImport = async (text) => {
    setImportBusy(true);
    try {
      const r = await callClaude(ewImportPrompt(text), false);
      const out = (r.companies || []).filter((x) => x && x.name).map((x) => {
        const existing = companies.find((c) => c.name.toLowerCase().includes(x.name.toLowerCase()) || x.name.toLowerCase().includes(c.name.toLowerCase()));
        const base = existing || { ...blankCompany(x.name), sector: x.sector || "" };
        return { kind: "ew", company: base, title: (existing ? "Nuovi segnali: " : "Nuova azienda: ") + base.name, items: buildEwProposal(base, x, "DW"), isNew: !existing };
      });
      setImportOpen(false);
      if (out.length) setReviews(out);
      else onInfo("Nel testo non ho trovato aziende identificabili.");
    } catch (e) {
      onError("Importazione non riuscita: " + e.message);
    }
    setImportBusy(false);
  };

  const current = reviews[0];
  const toggle = (id) => setReviews((p) => [{ ...p[0], items: p[0].items.map((i) => (i.id === id ? { ...i, on: !i.on } : i)) }, ...p.slice(1)]);
  const applyCurrent = () => {
    const nc = applyEwProposal(current.company, current.items, weights, trends);
    if (current.isNew) setCompanies((p) => [...p, { ...nc, prevScore: null }]);
    else replace(nc);
    setReviews((p) => p.slice(1));
  };

  const promote = (c) => {
    if (!window.confirm(`Promuovere ${c.name} a dossier nella sezione Ongoing procedures? L'azienda resta qui segnata come promossa.`)) return;
    replace({ ...c, promoted: true });
    setSelId(null);
    onPromote(companyToDossier(c));
  };

  const exportCSV = async () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["Azienda", "Settore", "Tipo", "Punteggio", "Fascia", "Variazione", "Segnale principale", "Numero segnali", "Ricavi", "Debito", "Fatturato >100 mln"];
    const rows = visible.map(({ c, r }) => [c.name, c.sector, c.type, r.score, bandOf(r.score).id, c.prevScore != null ? r.score - c.prevScore : "", r.parts[0]?.s.title || "", c.signals.length, c.financials?.revenue ?? "", c.financials?.debt ?? "", c.revenueCheck]);
    const csv = [head, ...rows].map((x) => x.map(esc).join(";")).join("\n");
    try {
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `early-warning-${todayISO()}.csv`;
      a.click();
      onInfo("Classifica esportata in CSV.");
    } catch (e) {
      const ok = await copyText(csv);
      onInfo(ok ? "Download non disponibile: CSV copiato negli appunti." : "Esportazione non riuscita in questo ambiente.");
    }
  };

  const menuItems = [
    { label: "Nuova azienda", hint: "Aggiungi un'azienda da monitorare", onClick: () => setEdit(blankCompany()) },
    { label: "Importa testo", hint: "Da un alert Debtwire o da un articolo", onClick: () => setImportOpen(true) },
    { label: progress ? `Ricerca ${progress.i} di ${progress.n} in corso` : "Cerca nuovi segnali per tutte", hint: "Ricerca web sulle aziende visibili", disabled: !!progress || !visible.length, onClick: () => { setTab("rank"); runSearchAll(); } },
    { label: "Esporta CSV", hint: "Scarica la classifica filtrata", disabled: !visible.length, onClick: exportCSV },
    { sep: true },
    { label: "Ripristina dati iniziali", hint: "Cancella aziende e pesi modificati", onClick: () => { if (window.confirm("Ripristinare l'universo iniziale e i pesi di partenza?")) { const res = applyEwPacks(EW_SEED, []); setCompanies(res.cs); setPacks(res.done); setWeights(DEFAULT_WEIGHTS); } } },
  ];

  const weekAgo = addMonths(todayISO(), 0);
  const newSignals = useMemo(() => {
    const lim = new Date(todayISO() + "T00:00:00");
    lim.setDate(lim.getDate() - 7);
    const limIso = lim.toISOString().slice(0, 10);
    return companies
      .flatMap((c) => c.signals.filter((s) => (s.addedAt || "") >= limIso).map((s) => ({ s, c })))
      .sort((a, b) => (b.s.addedAt || "").localeCompare(a.s.addedAt || "") || (b.s.date || "").localeCompare(a.s.date || ""));
  }, [companies, weekAgo]);

  const sectorStats = useMemo(() => {
    const m = new Map();
    scored.forEach(({ c, r }) => {
      const k = c.sector || "Settore n.d.";
      if (!m.has(k)) m.set(k, { sector: k, items: [], trends: new Map() });
      const g = m.get(k);
      g.items.push({ c, r });
      trendsFor(c, trends).forEach((t) => g.trends.set(t.id, t));
    });
    return [...m.values()]
      .map((g) => ({ ...g, avg: Math.round(g.items.reduce((a, x) => a + x.r.score, 0) / g.items.length), hot: g.items.filter((x) => x.r.score >= 50).length, trends: [...g.trends.values()] }))
      .sort((a, b) => b.avg - a.avg);
  }, [scored, trends]);

  const bandCounts = BANDS.map((b) => [b, scored.filter(({ r }) => bandOf(r.score).id === b.id).length]);

  return (
    <>
      <div className="ew-tabbar">
      <nav className="rx-tabs" role="tablist" aria-label="Sezioni Early Warning">
        {[["rank", "Classifica", companies.length], ["map", "Mappa settori", sectorStats.length], ["new", "Nuovi segnali", newSignals.length], ["bt", "Backtest", BACKTEST.length], ["w", "Pesi del modello", null]].map(([id, l, n]) => (
          <button key={id} className="rx-tab" role="tab" aria-selected={tab === id} onClick={() => setTab(id)}>
            {l} {n != null && <span className="rx-count">{n}</span>}
          </button>
        ))}
      </nav>
        <span className="ew-kebab">
          {progress && <span className="rx-pill">Ricerca {progress.i} di {progress.n}: {progress.name}</span>}
          <ActionsMenu items={menuItems} />
        </span>
      </div>

      {tab === "rank" && (
        <main>
          <div className="rx-chips" role="group" aria-label="Filtra per fascia">
            <button className="rx-fchip" aria-pressed={!fBand} onClick={() => setFBand("")}>Tutte <span className="n">{companies.length}</span></button>
            {bandCounts.map(([b, n]) => (
              <button key={b.id} className="rx-fchip" aria-pressed={fBand === b.id} onClick={() => setFBand(fBand === b.id ? "" : b.id)}>
                <span className="dot" style={{ background: b.color }} />{b.id} <span className="n">{n}</span>
              </button>
            ))}
          </div>
          <div className="rx-filters">
            <input className="rx-in grow" placeholder="Cerca azienda, settore, segnale o creditore" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Cerca" />
            <select className="rx-in" value={fSector} onChange={(e) => setFSector(e.target.value)} aria-label="Filtra per settore">
              <option value="">Tutti i settori</option>
              {sectors.map((x) => <option key={x}>{x}</option>)}
            </select>
          </div>
          <div className="ew-discbar"><EwDisclaimer /></div>
          <div className="rx-wl ew-wl">
            <div className="rx-wl-head" aria-hidden="true">
              <span />
              <span className="rx-num">#</span>
              <span>Azienda</span>
              <span>Punteggio</span>
              <span>Segnale principale</span>
              <span className="rx-num rx-hide-m">Segnali</span>
              <span className="rx-num rx-hide-m">Ricavi</span>
              <span />
            </div>
            {visible.length === 0 ? (
              <div className="rx-empty">Nessuna azienda corrisponde ai filtri.</div>
            ) : (
              visible.map(({ c, r }, k) => {
                const b = bandOf(r.score);
                const top = r.parts[0];
                return (
                  <button key={c.id} className="rx-wr" onClick={() => setSelId(c.id)} aria-label={`Apri ${c.name}`}>
                    <span className="rx-wr-spine" style={{ background: b.color }} aria-hidden="true" />
                    <span className="rx-c rx-num ew-rank">{k + 1}</span>
                    <span className="rx-c">
                      <span className="rx-wr-name">{c.name}</span>
                      <span className="rx-wr-sub">{c.sector || "Settore n.d."}, {c.type}{c.promoted && <span className="rx-new">Promosso</span>}</span>
                    </span>
                    <span className="rx-c"><ScoreBadge score={r.score} delta={c.prevScore != null ? r.score - c.prevScore : null} /></span>
                    <span className="rx-c">
                      {top ? (
                        <>
                          <span className="rx-wr-news clamp">{top.s.title}</span>
                          <span className="rx-wr-sub">{FAM_LABEL[top.s.family]}, {fmtDate(top.s.date)}</span>
                        </>
                      ) : (
                        <span className="rx-wr-sub">Nessun segnale attivo</span>
                      )}
                    </span>
                    <span className="rx-c rx-num rx-hide-m"><span className="rx-wr-fig">{c.signals.length}</span></span>
                    <span className="rx-c rx-num rx-hide-m"><span className="rx-wr-fig">{c.financials?.revenue != null ? fmtNum(c.financials.revenue) : "n.d."}</span></span>
                    <span className="rx-wr-chev" aria-hidden="true"><Icon name="chev" /></span>
                  </button>
                );
              })
            )}
          </div>
          <p className="rx-note" style={{ margin: "12px 32px 0" }}>
            Esclusi perché già in procedura o fuori criterio: {EW_EXCLUDED.map((x) => `${x.name} (${x.why.toLowerCase()})`).join("; ")}.
          </p>
        </main>
      )}

      {tab === "map" && (
        <div className="rx-macro">
          <div className="rx-mhead">
            <div>
              <h2 className="rx-mtitle">Mappa di calore dei settori</h2>
              <div className="rx-sub">Punteggio medio per settore, aziende in Arancio e Rosso e macrotrend collegati. Clicca un settore per filtrare la classifica.</div>
            </div>
          </div>
          <div className="ew-heat">
            {sectorStats.map((g) => {
              const b = bandOf(g.avg);
              return (
                <button key={g.sector} className="ew-tile" style={{ background: b.tint, borderColor: b.color }} onClick={() => { setFSector(g.sector === "Settore n.d." ? "" : g.sector); setFBand(""); setTab("rank"); }}>
                  <span className="ew-tile-top"><b>{g.sector}</b><span className="rx-num" style={{ color: b.color }}>{g.avg}</span></span>
                  <span className="rx-wr-sub">{g.items.length === 1 ? "1 azienda" : `${g.items.length} aziende`}, {g.hot} in Arancio o Rosso</span>
                  <span className="ew-tile-names">{g.items.sort((a, z) => z.r.score - a.r.score).map((x) => x.c.name).join(", ")}</span>
                  {g.trends.length > 0 && <span className="ew-tile-trends">{g.trends.map((t) => <span key={t.id} className={"rx-int " + t.intensity}>{t.short}</span>)}</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {tab === "new" && (
        <div className="rx-macro">
          <div className="rx-mhead">
            <div>
              <h2 className="rx-mtitle">Nuovi segnali della settimana</h2>
              <div className="rx-sub">Segnali inseriti negli ultimi 7 giorni, a mano, da importazione o da ricerca. La data a sinistra è quella del fatto.</div>
            </div>
          </div>
          <div className="rx-sec" style={{ borderTop: 0 }}>
            {newSignals.length === 0 ? (
              <p style={{ color: "var(--muted)" }}>Nessun segnale nuovo negli ultimi 7 giorni. Usa Cerca nuovi segnali dal menu ⋯.</p>
            ) : (
              <ol className="rx-tl">
                {newSignals.map(({ s, c }) => (
                  <li key={c.id + s.id}>
                    <div className="rx-tdate rx-num">{fmtDate(s.date)}</div>
                    <div>
                      <div className="rx-ttitle">{s.url ? <a href={s.url} target="_blank" rel="noopener noreferrer">{s.title}</a> : s.title}</div>
                      {s.value && <div className="rx-tsum">{s.value}</div>}
                      <div className="rx-tsrc">
                        <button className="rx-link" style={{ fontSize: 12.5 }} onClick={() => setSelId(c.id)}>{c.name}</button>
                        <span className={"rx-tag " + s.tag}>{s.tag}</span>
                        <span>{s.source}</span>
                        <span className="ew-chipfam">{FAM_LABEL[s.family]}</span>
                      </div>
                    </div>
                  </li>
                ))}
              </ol>
            )}
          </div>
        </div>
      )}

      {tab === "bt" && <BacktestView weights={weights} />}
      {tab === "w" && <WeightsPanel weights={weights} setWeights={setWeights} />}

      {selected && (
        <Drawer
          title={selected.name}
          sections={EW_SECTIONS}
          blocked={!!edit || importOpen || !!current}
          onClose={() => setSelId(null)}
          onPrev={idx > 0 ? () => setSelId(visible[idx - 1].c.id) : null}
          onNext={idx >= 0 && idx < visible.length - 1 ? () => setSelId(visible[idx + 1].c.id) : null}
        >
          <CompanyDetail
            c={selected}
            weights={weights}
            trends={trends}
            busy={busyId === selected.id}
            onSearch={runSearch}
            onEdit={(c) => setEdit(c)}
            onDelete={(c) => { if (window.confirm(`Eliminare ${c.name}?`)) { setCompanies((p) => p.filter((x) => x.id !== c.id)); setSelId(null); } }}
            onChange={replace}
            onPromote={promote}
          />
        </Drawer>
      )}
      {edit && (
        <CompanyEditModal
          initial={edit}
          allTrends={trends}
          onClose={() => setEdit(null)}
          onSave={(nc) => {
            if (companies.some((c) => c.id === nc.id)) replace(nc);
            else setCompanies((p) => [...p, nc]);
            setSelId(nc.id);
            setEdit(null);
          }}
        />
      )}
      {importOpen && <ImportModal busy={importBusy} onRun={runImport} onClose={() => setImportOpen(false)} />}
      {current && <ReviewModal review={current} index={0} total={reviews.length} onToggle={toggle} onApply={applyCurrent} onSkip={() => setReviews((p) => p.slice(1))} />}
    </>
  );
}

/* ---------- app ---------- */

function App() {
  const [dossiers, setDossiers] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [selId, setSelId] = useState(null);
  const [q, setQ] = useState("");
  const [fInstr, setFInstr] = useState("");
  const [fSector, setFSector] = useState("");
  const [sort, setSort] = useState("milestone");
  const [edit, setEdit] = useState(null);
  const [importOpen, setImportOpen] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [importBusy, setImportBusy] = useState(false);
  const [progress, setProgress] = useState(null);
  const [reviews, setReviews] = useState([]);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [onlyNew, setOnlyNew] = useState(false);
  const [tab, setTab] = useState("dossier");
  const [view, setView] = useState("ongoing");
  const [macro, setMacro] = useState(MACRO_SEED);
  const [openTrend, setOpenTrend] = useState(null);
  const [macroBusy, setMacroBusy] = useState(false);
  const [trendBusy, setTrendBusy] = useState(null);

  useEffect(() => {
    (async () => {
      let ds = SEED;
      let m = MACRO_SEED;
      let applied = [];
      try {
        const r = window.storage ? await window.storage.get(STORE_KEY, false) : null;
        if (r && r.value) ds = JSON.parse(r.value);
      } catch (e) {
        /* nessun dossier salvato: si parte dai dati iniziali */
      }
      try {
        const mm = window.storage ? await window.storage.get(MACRO_KEY, false) : null;
        if (mm && mm.value) m = JSON.parse(mm.value);
      } catch (e) {
        /* nessun dato macro salvato: restano i valori iniziali */
      }
      try {
        const p = window.storage ? await window.storage.get(PACKS_KEY, false) : null;
        if (p && p.value) applied = JSON.parse(p.value);
      } catch (e) {
        /* nessun pacchetto registrato */
      }
      const res = applyAllPacks(ds, m, applied);
      setDossiers(res.ds);
      setMacro(res.m);
      if (res.summary.length) {
        const nNews = res.summary.reduce((s, x) => s + x.nNews, 0);
        const nCred = res.summary.reduce((s, x) => s + x.nCred, 0);
        const added = res.summary.flatMap((x) => x.added);
        const nArt = res.summary.reduce((s, x) => s + (x.nArt || 0), 0);
        setInfo(
          `Aggiornamento del ${LATEST_PACK.label} applicato` +
            (nNews ? `: ${nNews} notizie nuove` : "") +
            (nArt ? `${nNews ? "," : ":"} ${nArt} articoli nei macrotrend` : "") +
            (nCred ? `, ${nCred} creditori aggiunti (vedi la scheda Creditori)` : "") +
            (added.length ? `, nuovi dossier ${added.join(", ")}` : "") +
            ". I dossier aggiornati sono segnati come Novità."
        );
        try {
          if (window.storage)
            await window.storage.set(PACKS_KEY, JSON.stringify([...applied, ...res.summary.map((x) => x.pack.id)]), false);
        } catch (e) {
          /* se non si salva, il pacchetto verrà riproposto senza duplicati */
        }
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded || !window.storage) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set(MACRO_KEY, JSON.stringify(macro), false);
      } catch (e) {
        setError("Salvataggio dei dati macro non riuscito: restano solo in questa sessione.");
      }
    }, 400);
    return () => clearTimeout(t);
  }, [macro, loaded]);

  useEffect(() => {
    if (tab === "macro" && openTrend) {
      const el = document.getElementById("trend-" + openTrend);
      if (el) el.scrollIntoView({ block: "start" });
    }
  }, [tab, openTrend]);

  useEffect(() => {
    if (!loaded || !window.storage) return;
    const t = setTimeout(async () => {
      try {
        await window.storage.set(STORE_KEY, JSON.stringify(dossiers), false);
      } catch (e) {
        setError("Salvataggio non riuscito: le modifiche restano solo in questa sessione.");
      }
    }, 400);
    return () => clearTimeout(t);
  }, [dossiers, loaded]);

  const sectors = useMemo(() => [...new Set(dossiers.map((d) => d.sector).filter(Boolean))].sort(), [dossiers]);

  const visible = useMemo(() => {
    const ql = q.trim().toLowerCase();
    let l = dossiers.filter((d) => {
      if (fInstr && d.instrument !== fInstr) return false;
      if (fSector && d.sector !== fSector) return false;
      if (onlyNew && !isNewDossier(d)) return false;
      if (!ql) return true;
      const hay = [d.name, d.sector, d.court, d.phase, ...d.advisors.map((a) => a.name), ...(d.creditors || []).map((c) => c.name), ...d.news.map((n) => n.title)]
        .join(" ")
        .toLowerCase();
      return hay.includes(ql);
    });
    const lastNews = (d) => d.news[0]?.date || "";
    l = [...l].sort((a, b) => {
      if (sort === "name") return a.name.localeCompare(b.name);
      if (sort === "debt") return (Number(b.financials?.debt) || -1) - (Number(a.financials?.debt) || -1);
      if (sort === "news") return lastNews(b).localeCompare(lastNews(a));
      const da = daysUntil(a.milestone?.date);
      const db = daysUntil(b.milestone?.date);
      const va = da === null || da < 0 ? 99999 : da;
      const vb = db === null || db < 0 ? 99999 : db;
      return va - vb || lastNews(b).localeCompare(lastNews(a));
    });
    return l;
  }, [dossiers, q, fInstr, fSector, sort, onlyNew]);

  const selected = dossiers.find((d) => d.id === selId) || null;

  const replace = (nd) => setDossiers((p) => p.map((d) => (d.id === nd.id ? nd : d)));

  const runUpdate = async (d) => {
    setError("");
    setBusyId(d.id);
    try {
      const r = await callClaude(updatePrompt(d), true);
      setReviews([{ dossier: d, items: buildProposal(d, r), isNew: false }]);
    } catch (e) {
      setError(`Aggiornamento di ${d.name} non riuscito: ${e.message}`);
    }
    setBusyId(null);
  };

  const runUpdateAll = async () => {
    setError("");
    const list = visible;
    const out = [];
    for (let i = 0; i < list.length; i++) {
      setProgress({ i: i + 1, n: list.length, name: list[i].name });
      try {
        const r = await callClaude(updatePrompt(list[i]), true);
        const items = buildProposal(list[i], r);
        if (items.length) out.push({ dossier: list[i], items, isNew: false });
      } catch (e) {
        /* prosegue con il dossier successivo */
      }
    }
    setProgress(null);
    if (out.length) setReviews(out);
    else setInfo("Nessuna informazione nuova trovata per i dossier visibili.");
  };

  const runImport = async (text) => {
    setError("");
    setImportBusy(true);
    try {
      const r = await callClaude(importPrompt(text), false);
      const out = (r.dossiers || [])
        .filter((x) => x && x.name)
        .map((x) => {
          const existing = dossiers.find(
            (d) => d.name.toLowerCase().includes(x.name.toLowerCase()) || x.name.toLowerCase().includes(d.name.toLowerCase())
          );
          const base = existing || blankDossier(x.name);
          return { dossier: base, items: buildProposal(base, x, "DW"), isNew: !existing };
        });
      setImportOpen(false);
      if (out.length) setReviews(out);
      else setInfo("Nel testo non ho trovato debitori identificabili.");
    } catch (e) {
      setError("Importazione non riuscita: " + e.message);
    }
    setImportBusy(false);
  };

  const current = reviews[0];
  const toggle = (id) =>
    setReviews((p) => [{ ...p[0], items: p[0].items.map((i) => (i.id === id ? { ...i, on: !i.on } : i)) }, ...p.slice(1)]);
  const runMacroUpdate = async () => {
    setError("");
    setMacroBusy(true);
    try {
      const r = await callClaude(macroPrompt(macro.indicators), true);
      const items = buildIndicatorProposal(macro, r);
      if (items.length) setReviews([{ kind: "macro", title: "Aggiornamento degli indicatori macro", items }]);
      else setInfo("Nessun indicatore con un dato più recente di quelli registrati.");
    } catch (e) {
      setError("Aggiornamento degli indicatori non riuscito: " + e.message);
    }
    setMacroBusy(false);
  };

  const runTrendSignals = async (t) => {
    setError("");
    setTrendBusy(t.id);
    try {
      const r = await callClaude(trendPrompt(t), true);
      const items = buildSignalProposal(t, r);
      if (items.length) setReviews([{ kind: "trend", trendId: t.id, title: "Nuovi articoli: " + t.short, items }]);
      else setInfo(`Nessun segnale nuovo trovato per ${t.short}.`);
    } catch (e) {
      setError(`Ricerca dei segnali su ${t.short} non riuscita: ${e.message}`);
    }
    setTrendBusy(null);
  };

  const openDossier = (id) => {
    setQ("");
    setFInstr("");
    setFSector("");
    setSelId(id);
    setTab("dossier");
  };

  const openTrendFromDossier = (id) => {
    setOpenTrend(id);
    setTab("macro");
  };

  const applyCurrent = () => {
    if (current.kind === "macro") {
      setMacro((m) => ({
        ...m,
        updatedAt: new Date().toISOString(),
        indicators: m.indicators.map((ind) => {
          const it = current.items.find((i) => i.on && i.value.id === ind.id);
          if (!it) return ind;
          const v = it.value;
          return {
            ...ind,
            value: v.value,
            prior: v.prior || ind.value,
            date: v.date || ind.date,
            note: v.note || "",
            source: v.source || ind.source,
            url: v.url || ind.url,
            tag: v.tag === "F" ? "F" : "S",
            risk: ["su", "stabile", "giu"].includes(v.risk) ? v.risk : ind.risk,
          };
        }),
      }));
    } else if (current.kind === "trend") {
      setMacro((m) => ({
        ...m,
        trends: m.trends.map((t) =>
          t.id !== current.trendId
            ? t
            : {
                ...t,
                signals: [...current.items.filter((i) => i.on).map((i) => i.value), ...(t.signals || [])].sort((a, b) =>
                  (b.date || "").localeCompare(a.date || "")
                ),
              }
        ),
      }));
    } else {
      const nd = applyProposal(current.dossier, current.items);
      if (current.isNew) setDossiers((p) => [...p, nd]);
      else replace(nd);
      setSelId(nd.id);
    }
    setReviews((p) => p.slice(1));
  };

  const exportCSV = async () => {
    const head = ["Debitore", "Settore", "Strumento", "Tribunale", "Fase", "Ricavi", "EBITDA", "Debito", "Leva", "Prossima scadenza", "Ultima notizia", "Data ultima notizia", "Principali creditori", "Advisor", "Angolo di ingresso", "Pitch", "Client", "Interesse", "Nota interesse"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = visible.map((d) => [
      d.name, d.sector, d.instrument, d.court, d.phase,
      d.financials?.revenue ?? "", d.financials?.ebitda ?? "", d.financials?.debt ?? "",
      leverage(d.financials) || "",
      d.milestone?.date ? `${d.milestone.date} ${d.milestone.label || ""}` : "",
      d.news[0]?.title || "", d.news[0]?.date || "",
      (d.creditors || []).map((c) => `${c.name} (${c.type}${c.exposure != null ? ", " + c.exposure + " mln" : ""})`).join("; "),
      d.advisors.map((a) => `${a.name} (${a.side})`).join("; "),
      (d.angle || []).join(", "),
      d.pitch ? "Sì" : "", d.client ? "Sì" : "", d.interest || "", d.interestNote || "",
    ]);
    const csv = [head, ...rows].map((r) => r.map(esc).join(";")).join("\n");
    try {
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `registro-restructuring-${todayISO()}.csv`;
      a.click();
      setInfo("CSV esportato.");
    } catch (e) {
      try {
        await navigator.clipboard.writeText(csv);
        setInfo("Download non disponibile: CSV copiato negli appunti.");
      } catch (e2) {
        setError("Esportazione non riuscita in questo ambiente.");
      }
    }
  };

  const resetSeed = () => {
    if (window.confirm("Ripristinare i dossier iniziali? Le modifiche salvate andranno perse.")) {
      const res = applyAllPacks(SEED, MACRO_SEED);
      setDossiers(res.ds);
      setMacro(res.m);
      setSelId(null);
    }
  };

  const idx = selected ? visible.findIndex((d) => d.id === selected.id) : -1;
  const maxDebt = Math.max(0, ...dossiers.map((x) => Number(x.financials && x.financials.debt) || 0));
  const credCount = new Set(dossiers.flatMap((d) => (d.creditors || []).filter((c) => !c.generic).map((c) => credKey(c.name)))).size;
  const instrCounts = INSTRUMENTS.map((i) => [i, dossiers.filter((d) => d.instrument === i).length]).filter(([, n]) => n > 0);
  const menuItems = [
    { label: "Nuovo dossier", hint: "Aggiungi un debitore a mano", onClick: () => setEdit(blankDossier()) },
    { label: "Importa testo", hint: "Da un alert Debtwire o da un articolo", onClick: () => setImportOpen(true) },
    {
      label: progress ? `Aggiornamento ${progress.i} di ${progress.n} in corso` : "Aggiorna i dossier visibili",
      hint: "Cerca notizie, creditori e financials sul web",
      disabled: !!progress || !visible.length,
      onClick: () => {
        setTab("dossier");
        runUpdateAll();
      },
    },
    { label: "Esporta CSV", hint: "Scarica i dossier filtrati", disabled: !visible.length, onClick: exportCSV },
    { sep: true },
    { label: "Ripristina dati iniziali", hint: "Cancella le modifiche salvate", onClick: resetSeed },
  ];

  return (
    <div className="rx">
      <style>{CSS}</style>

      <header className="rx-top">
        <div>
          <label className="rx-viewsel">
            <span className="rx-sr">Sezione</span>
            <select value={view} onChange={(e) => { setView(e.target.value); setSelId(null); }} aria-label="Sezione">
              <option value="ongoing">Ongoing procedures</option>
              <option value="targets">Potential targets</option>
            </select>
          </label>
          <h1 className="rx-title">Italian Restructuring Watchlist</h1>
          <div className="rx-sub">
            {view === "targets"
              ? "Early Warning: aziende italiane oltre 100 mln € con segnali pubblici di tensione, non ancora in procedura."
              : loaded ? `${dossiers.length} dossier seguiti sul mercato italiano. Ultimo aggiornamento: ${LATEST_PACK.label}.` : "Caricamento dei dossier…"}
          </div>
        </div>
        {view === "ongoing" && (
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {progress && <span className="rx-pill">Aggiornamento {progress.i} di {progress.n}: {progress.name}</span>}
            <ActionsMenu items={menuItems} />
          </div>
        )}
      </header>

      {view === "ongoing" && (
      <nav className="rx-tabs" role="tablist" aria-label="Sezioni">
        <button className="rx-tab" role="tab" aria-selected={tab === "dossier"} onClick={() => setTab("dossier")}>
          Dossier <span className="rx-count">{dossiers.length}</span>
        </button>
        <button className="rx-tab" role="tab" aria-selected={tab === "creditori"} onClick={() => setTab("creditori")}>
          Creditori <span className="rx-count">{credCount}</span>
        </button>
        <button className="rx-tab" role="tab" aria-selected={tab === "macro"} onClick={() => setTab("macro")}>
          Macrotrend <span className="rx-count">{macro.trends.length}</span>
        </button>
      </nav>
      )}

      {error && (
        <div className="rx-banner" role="alert">
          <span>{error}</span>
          <button className="rx-btn ghost" onClick={() => setError("")}>Chiudi</button>
        </div>
      )}
      {info && (
        <div className="rx-banner info" role="status">
          <span>{info}</span>
          <button className="rx-btn ghost" onClick={() => setInfo("")}>Chiudi</button>
        </div>
      )}

      {view === "targets" ? (
        <EarlyWarning
          macro={macro}
          onInfo={setInfo}
          onError={setError}
          onPromote={(nd) => {
            setDossiers((p) => [...p, nd]);
            setView("ongoing");
            setTab("dossier");
            setSelId(nd.id);
            setInfo(`${nd.name} è stato aggiunto ai dossier in Ongoing procedures.`);
          }}
        />
      ) : tab === "creditori" ? (
        <CreditorsView dossiers={dossiers} onOpenDossier={openDossier} onInfo={setInfo} />
      ) : tab === "macro" ? (
        <MacroView
          macro={macro}
          dossiers={dossiers}
          openTrend={openTrend}
          setOpenTrend={setOpenTrend}
          onOpenDossier={openDossier}
          onUpdateIndicators={runMacroUpdate}
          onTrendSignals={runTrendSignals}
          busy={macroBusy}
          busyTrend={trendBusy}
        />
      ) : (
        <main>
          <Overview dossiers={dossiers} fInstr={fInstr} onInstr={setFInstr} onOpen={setSelId} />
          <div className="rx-chips" role="group" aria-label="Filtra per strumento">
            <button className="rx-fchip" aria-pressed={!fInstr} onClick={() => setFInstr("")}>
              Tutti <span className="n">{dossiers.length}</span>
            </button>
            {instrCounts.map(([i, n]) => (
              <button key={i} className="rx-fchip" aria-pressed={fInstr === i} onClick={() => setFInstr(fInstr === i ? "" : i)}>
                <span className="dot" style={{ background: INSTR_COLOR[i] }} />
                {i} <span className="n">{n}</span>
              </button>
            ))}
          </div>

          <div className="rx-filters">
            <input className="rx-in grow" placeholder="Cerca debitore, creditore, advisor o notizia" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Cerca" />
            <select className="rx-in" value={fSector} onChange={(e) => setFSector(e.target.value)} aria-label="Filtra per settore">
              <option value="">Tutti i settori</option>
              {sectors.map((x) => <option key={x}>{x}</option>)}
            </select>
            <label className="rx-in rx-check">
              <input type="checkbox" checked={onlyNew} onChange={(e) => setOnlyNew(e.target.checked)} />
              Solo novità del {LATEST_PACK.label}
            </label>
            <select className="rx-in" value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Ordina">
              <option value="milestone">Ordina per prossima scadenza</option>
              <option value="news">Ordina per ultima notizia</option>
              <option value="debt">Ordina per debito</option>
              <option value="name">Ordina per nome</option>
            </select>
          </div>

          <div className="rx-wl">
            <div className="rx-wl-head" aria-hidden="true">
              <span />
              <span>Debitore</span>
              <span>Strumento e fase</span>
              <span className="rx-num">Debito</span>
              <span>Prossima scadenza</span>
              <span className="rx-hide-m">Ultima notizia</span>
              <span className="rx-num rx-hide-m">Creditori</span>
              <span />
            </div>
            {visible.length === 0 ? (
              <div className="rx-empty">
                Nessun dossier corrisponde ai filtri.{" "}
                <button className="rx-link" onClick={() => { setQ(""); setFInstr(""); setFSector(""); setOnlyNew(false); }}>Azzera i filtri</button>
              </div>
            ) : (
              visible.map((d) => <WatchRow key={d.id} d={d} onOpen={setSelId} maxDebt={maxDebt} />)
            )}
          </div>
        </main>
      )}

      <footer className="rx-foot">
        <span>
          Fonti: F fatto verificato, S stampa, DW Debtwire, I interpretazione. Verifica sempre la fonte prima di usare un dato con clienti o creditori.
        </span>
      </footer>

      {view === "ongoing" && selected && (
        <Drawer
          title={selected.name}
          blocked={!!edit || importOpen || !!current}
          onClose={() => setSelId(null)}
          onPrev={idx > 0 ? () => setSelId(visible[idx - 1].id) : null}
          onNext={idx >= 0 && idx < visible.length - 1 ? () => setSelId(visible[idx + 1].id) : null}
        >
          <Detail
            d={selected}
            busy={busyId === selected.id}
            onUpdate={runUpdate}
            onEdit={(d) => setEdit(d)}
            onDelete={(d) => {
              if (window.confirm(`Eliminare il dossier ${d.name}?`)) {
                setDossiers((p) => p.filter((x) => x.id !== d.id));
                setSelId(null);
              }
            }}
            onChange={replace}
            trends={trendsFor(selected, macro.trends)}
            onOpenTrend={(id) => {
              setSelId(null);
              openTrendFromDossier(id);
            }}
          />
        </Drawer>
      )}

      {edit && (
        <EditModal
          initial={edit}
          allTrends={macro.trends}
          onClose={() => setEdit(null)}
          onSave={(nd) => {
            if (dossiers.some((d) => d.id === nd.id)) replace(nd);
            else setDossiers((p) => [...p, nd]);
            setSelId(nd.id);
            setEdit(null);
          }}
        />
      )}
      {importOpen && <ImportModal busy={importBusy} onRun={runImport} onClose={() => setImportOpen(false)} />}
      {current && (
        <ReviewModal
          review={current}
          index={0}
          total={reviews.length}
          onToggle={toggle}
          onApply={applyCurrent}
          onSkip={() => setReviews((p) => p.slice(1))}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
